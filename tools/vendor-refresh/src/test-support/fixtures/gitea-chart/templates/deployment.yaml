apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
        - name: init-directories
          image: busybox:1.36.1
          command: ["sh", "/tmp/init/init_directory_structure.sh"]
      containers:
        - name: gitea
          {{- $tag := .Values.image.tag | default (printf "%s-rootless" .Chart.AppVersion) }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ $tag }}"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-shared-storage
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-http
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 3000
