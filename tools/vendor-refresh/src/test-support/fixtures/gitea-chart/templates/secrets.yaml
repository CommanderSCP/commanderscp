{{/* The config-environment machinery secret, named exactly like the real chart's — the vendored
     Deployment's own volumes reference it by this name, so a re-vendor's extraction logic keys on
     it rather than re-deriving it. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config_environment.sh: |-
    #!/usr/bin/env bash
    echo "fixture config_environment.sh for {{ .Chart.AppVersion }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-init
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  configure_gpg_environment.sh: |-
    #!/usr/bin/env bash
    echo "fixture configure_gpg_environment.sh"
  init_directory_structure.sh: |-
    #!/usr/bin/env bash
    echo "fixture init_directory_structure.sh"
  configure_gitea.sh: |-
    #!/usr/bin/env bash
    echo "fixture configure_gitea.sh"
---
{{/* A THIRD secret that must be stripped but is NOT one of the two we extract from — proves the
     strip logic removes every Secret, not just the two named ones. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: fixture-admin
  password: fixture-password
---
{{/* The helm-test connection pod — stripped by its helm.sh/hook annotation, not by its name. */}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-connection
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36.1
      command: ["wget", "{{ .Release.Name }}-http:3000"]
