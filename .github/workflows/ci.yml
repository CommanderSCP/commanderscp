name: CI

# Stages 1-4 (+5 Integration, +7 E2E) from BUILD_AND_TEST.md §6. Every stage is a plain pnpm
# command with no hosted-service dependency, so the same pipeline runs on self-hosted runners or
# a bare local runner script (charter self-hosting requirement — §6).
#
# WHAT ACTUALLY GATES A PR: stages 1-5, plus 4b (helm-verify) and 5y (prod-audit) as of this PR —
# branch protection requires "3. Codegen drift" and "5z. Integration (aggregation gate)", and 5z
# now `needs:` the integration-shard matrix, helm-verify, AND prod-audit directly (previously 4b
# was reachable from nothing and a red 4b did not block merge, despite that job's own comment
# claiming otherwise; 5y is net-new). Job 4d (testcontainer-images) is also new this PR: a
# prerequisite of integration-shard that mirrors postgres/nats/registry off Docker Hub, not a gate
# itself. Every E2E job below (7, 8, 8b-8d, 9, plus the 9a image build they depend on) carries
# `if: github.event_name == 'push' && github.ref == 'refs/heads/main'` and is SKIPPED on pull
# requests. There is no "PR subset" of stage 7 — no --grep, no project filter, no second job; an
# earlier version of this comment and of §6 claimed one, and it was never built. So a regression
# that only a Playwright spec covers reaches `main` with both required checks green and is caught
# only afterwards. Anything that must not regress needs an assertion reachable from job 4, 4b, 5,
# or 5y.
#
# RUNNERS: GitHub-hosted `ubuntu-latest` throughout (previously two homelab ARC self-hosted labels,
# `homelab-commanderscp-linux-general` and `homelab-commanderscp-linux-docker-build`). The old split
# existed because only the docker-build label had a Docker daemon; `ubuntu-latest` ships a native
# daemon plus Node/pnpm-capable tooling, so ONE label serves every job and the general/docker-build
# distinction no longer buys anything. This does NOT weaken the charter portability requirement:
# no stage gained a hosted-service dependency — the jobs are still plain pnpm/docker commands and
# still run unchanged on a self-hosted runner. Jobs that need helm/kubectl/kind/cosign/skopeo keep
# installing them in-workflow exactly as before, so they remain runner-image-agnostic.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "1. Setup & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  static-checks:
    name: "2. Static checks (format + lint + typecheck)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      # `format:check` existed as a root script from the beginning and was referenced by NO
      # workflow, so 229 files had drifted out of Prettier's shape with nothing to notice. Wired
      # here (owner decision 2026-08-01: reformat the repo, then gate it) rather than as its own
      # job: it is a static check on the same checkout as lint/typecheck, and it is reachable from
      # the required gate through this job exactly as they are.
      #
      # It runs FIRST because it is the cheapest of the three and its failure is the most trivially
      # fixable — `pnpm format` and commit. A contributor should not wait out a typecheck to be
      # told about whitespace.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # CORRECTNESS gate: stale codegen means the committed spec/SDK don't match the routes, so every
  # downstream job would be testing a lie. This one SHOULD gate them (see `needs:` on integration/e2e).
  codegen-drift:
    name: "3. Codegen drift"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm gen
      - run: git diff --exit-code

  # POLICY gate, deliberately SEPARATE from the correctness gate above and depended on by NOTHING.
  #
  # The API is additive-only within /v1, but an intentional break is a legitimate, owner-approved
  # outcome via the `api-v2-exception` label (tools/openapi/check.sh's header, BUILD_AND_TEST.md §6).
  # This job therefore MUST NOT sit in any `needs:` chain: when it was bundled into "3. Codegen drift"
  # above, an approved break failed that job and SILENTLY SKIPPED integration + every E2E — which bit
  # us for real on PR #35 (the parent/child -> commander/outpost rename), a PR shipping a MIGRATION
  # that consequently got ZERO database coverage while every visible check looked fine. A policy gate
  # a human may override must never be able to cancel test execution.
  #
  # No build/gen here: job 3 above already proves the COMMITTED spec is byte-identical to the freshly
  # emitted one, so diffing the committed spec is equivalent and costs seconds instead of a full build.
  # fetch-depth: 0 so check.sh's `git merge-base origin/main HEAD` can resolve the base spec.
  api-breaking-change:
    name: "3b. API breaking-change gate (oasdiff, /v1 additive-only)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The `api-v2-exception` label is now READ here, not merely documented. Until this step
      # existed the label was prose in three files and no workflow consumed it: an approved break
      # went red and a human merged past it, and an UNapproved break looked exactly the same. The
      # analysis always runs, so the breaking items are in the log either way — the label only
      # decides whether they FAIL the job.
      #
      # The label alone is not enough: it must be paired with an entry in OASDIFF-EXCEPTIONS.md
      # added by this same PR. That is already the documented process (§6, check.sh's header); this
      # makes it mechanical, so the label cannot become a rubber stamp that leaves no durable record
      # of what broke and why. Labels are read from the event payload, which is fixed when the run
      # starts — LABEL FIRST, THEN TRIGGER A FRESH RUN (push a commit, or close+reopen the PR). A re-run does
      # NOT suffice: it replays the original payload, so a label added afterwards stays invisible to it.
      #
      # Only users with write access can label, so a fork PR cannot self-approve its own break.
      - name: oasdiff /v1 additive-only gate
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'api-v2-exception') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if tools/openapi/check.sh; then
            echo "No breaking /v1 change."
            exit 0
          fi
          if [ "${APPROVED}" != "true" ]; then
            echo "::error::Breaking change within /v1. If this is intentional and owner-approved, add the 'api-v2-exception' label AND an entry in tools/openapi/OASDIFF-EXCEPTIONS.md, then trigger a FRESH run (push a commit, or close+reopen the PR) — a re-run replays the original event payload and will NOT see a newly-added label (BUILD_AND_TEST.md §6)."
            exit 1
          fi
          if ! git diff --name-only "${BASE_SHA}" HEAD -- tools/openapi/OASDIFF-EXCEPTIONS.md | grep -q .; then
            echo "::error::'api-v2-exception' is applied but this PR adds no entry to tools/openapi/OASDIFF-EXCEPTIONS.md. The label and the log entry go together — the log is the durable record of what broke and why (BUILD_AND_TEST.md §6)."
            exit 1
          fi
          echo "::warning::Breaking /v1 change ACCEPTED under the 'api-v2-exception' label, with an OASDIFF-EXCEPTIONS.md entry in this PR. The breaking items are listed above."
          exit 0

  unit-tests:
    name: "4. Unit tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      # This job installs NO tools of its own, deliberately: `pnpm test` (turbo run test) reflects
      # "unit tests," not "unit tests plus whatever else got installed here." Do not add a tool
      # -install step to this job.
      #
      # Every tool-dependent check reachable from the default `test` task (tools/helm-verify's
      # `test` script; deploy/airgap's install.sh-tamper suite) probes for its own binary and SKIPS
      # (not fails) when absent — see tools/helm-verify/src/verify.ts's and
      # deploy/airgap/src/install-sh-tamper.test.ts's own comments. Those same assertions are
      # genuinely CI-gated elsewhere, with the tool explicitly installed first: helm-verify below
      # (job 4b) and the install.sh tamper suite in job 5 (Integration).
      #
      # RUNNER NOTE: the old `homelab-commanderscp-linux-general` label shipped Node ONLY, so those
      # probes always took the skip branch here. `ubuntu-latest` PRE-INSTALLS helm, so
      # tools/helm-verify now genuinely renders and asserts inside this job too. That is a
      # strengthening, not a risk — job 4b runs the identical script against a pinned Helm and is
      # still the job that GUARANTEES the assertions run — but it means this stage's result is no
      # longer independent of GitHub's runner-image contents. cosign and skopeo are NOT
      # pre-installed, and the tamper suite requires all three, so it still skips here as designed.
      #
      # `--coverage`, not a bare `pnpm test`: the per-app `vitest.config.ts` files now carry
      # coverage THRESHOLDS (owner decision 2026-08-01), and a threshold only fails a run when
      # coverage is actually collected. Without this flag the thresholds would be decorative —
      # which is precisely the state §7 was in when it claimed "≥80%" while configuring nothing.
      # Turbo forwards everything after `--` to each package's `test` script.
      - run: pnpm test -- --coverage

  helm-verify:
    name: "4b. Helm hardened-defaults gate (tools/helm-verify)"
    # Adversarial review MAJOR #4 on PR #15: the hardening tools/helm-verify asserts (non-root,
    # read-only-rootfs, dropped caps, seccomp, default-deny NetworkPolicy with no any-destination
    # DB-port egress, migrations-hook, least-priv DB creds, ingress mTLS annotations) genuinely
    # apply today, but the tool was never invoked anywhere in CI — "CI gate" was aspirational, not
    # real; a values.yaml regression would have shipped silently. This job is the actual gate: it
    # fails the build on any of those assertions regressing. Pure `helm template` (offline
    # rendering, no live cluster) — no Docker daemon needed.
    #
    # Helm is a documented toolchain prerequisite (BUILD_AND_TEST.md §1). This job installs a real
    # Helm binary ITSELF (`azure/setup-helm@v4`, a static-binary download, no sudo/apt needed)
    # rather than trusting whatever is on the runner. That was originally forced by the old
    # `homelab-commanderscp-linux-general` label shipping Node only (this job went red on PR #15
    # with `spawnSync helm ENOENT`); it is KEPT on `ubuntu-latest` — which does pre-install helm —
    # precisely so this gate does not depend on GitHub's runner-image contents and stays valid on
    # any self-hosted runner. `tools/helm-verify/src/verify.ts` SKIPS cleanly when helm is absent
    # (see its own comment), so THIS job — which always has helm — is what makes the assertions
    # capable of being an unconditional gate.
    #
    # CORRECTION (this PR): "capable of" is the accurate word, not "is" — this job was never in any
    # `needs:` chain and branch protection requires only "5z. Integration (aggregation gate)" and
    # "3. Codegen drift", so a red 4b did NOT block merge; the paragraph above previously claimed
    # otherwise. Fixed by adding this job to job 5z's `needs:` below, the same mechanism job 5z's
    # own comment already documents for static-checks/codegen-drift/unit-tests/runner-images.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: "Install Helm (BUILD_AND_TEST.md §1: 3.16+) — pinned here, not trusted from the runner image"
        uses: azure/setup-helm@v4
        with:
          version: latest
      - run: pnpm build
      - run: pnpm --filter @scp/helm-verify test

  runner-images:
    name: "4c. Prebuild + publish runner images to GHCR (content-hash tags)"
    # LEVER 1: the integration tests need two ephemeral runner images — scp-runner-scan (promotion
    # scan step) and scp-runner-iac (managed-IaC). They used to `docker build` them in-process on
    # EVERY integration run (minutes per run). This job builds them ONCE per content change and
    # publishes them to GHCR by a content-hash tag (scripts/runner-image-tags.sh — the single source
    # of truth for the tag formula, shared with the integration job's pull step); the integration
    # job then just `docker pull`s them. Model mirrors the `ci-image` job (9a) exactly: pull the
    # tag, and only build+push on a cache miss (the build context actually changed). Runs on every
    # push/PR (no main-only guard) so a PR that touches a runner Dockerfile or a scanner pin rebuilds
    # + republishes before the integration job pulls it. Needs a real Docker daemon, which
    # `ubuntu-latest` provides natively.
    #
    # RETAINED: `DOCKER_BUILDKIT=0` stays, for a reason that is NOT the DinD wedge. Both runner
    # Dockerfiles begin `# syntax=docker/dockerfile:1.7` — a BuildKit-ONLY frontend directive. The
    # legacy builder treats that line as a comment (inert); BuildKit treats it as live and, on a
    # cache miss, PULLS `docker/dockerfile:1.7` from Docker Hub — an unauthenticated, rate-limitable
    # external dependency, against CLAUDE.md #5 (vendored tooling, no outside calls). Keeping the
    # legacy builder keeps the build hermetic. (`apps/runner-scan/Dockerfile` is also MULTI-stage —
    # `FROM ... AS trivy` + `COPY --from=trivy` — which the legacy builder handles fine; multi-stage
    # long predates BuildKit. An earlier revision of this comment claimed both Dockerfiles were
    # "plain single-stage ... with no BuildKit-only features": both halves were false.)
    # The ORIGINAL DinD justification (PR #126: BuildKit's embedded gRPC session deadlocking against
    # `--network none` container ops in one daemon) no longer applies on a native daemon — but the
    # flag was load-bearing for the frontend-pull reason nobody had recorded. Also retained in
    # `resolveRunnerImage`'s local-dev fallback, which does build and run net=none containers in one
    # daemon (packages/plugin-testkit/src/runner-image.ts).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute the content-hash runner image tags (shared formula)
        run: scripts/runner-image-tags.sh >> "$GITHUB_ENV"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull each pre-built runner image, or build+push once on a cache miss
        run: |
          build_and_push() {
            image="$1"; context="$2"
            if docker pull "$image"; then
              echo "cache hit: $image already in GHCR — no build needed."
            else
              echo "cache miss: building $image from $context and pushing to GHCR."
              DOCKER_BUILDKIT=0 docker build -t "$image" "$context"
              docker push "$image"
            fi
          }
          build_and_push "$SCP_RUNNER_SCAN_IMAGE_REF" apps/runner-scan
          build_and_push "$SCP_RUNNER_IAC_IMAGE_REF" apps/runner-iac

  testcontainer-images:
    name: "4d. Mirror Testcontainer images to GHCR (postgres, nats, registry, minio)"
    # Job 5 below starts postgres:16, nats:2.10, and registry:2 directly via Testcontainers
    # (PostgreSqlContainer/GenericContainer in apps/server's integration suites — e.g.
    # event-bus.integration.test.ts, promotion-scan-step.integration.test.ts,
    # retrans-relay.integration.test.ts) — a live `docker pull` from Docker Hub, unauthenticated,
    # on every shard of every run. Docker Hub's anonymous-pull rate limit / occasional registry
    # timeouts intermittently red job 5 — the REQUIRED integration gate — for a reason that has
    # nothing to do with the code under test.
    #
    # Same "pull/build once, publish to GHCR, reuse" shape as job 4c (runner-images) and job 9a
    # (ci-image), but for third-party images we don't build: mirror each upstream tag to GHCR
    # under a fixed path, keyed by the tag itself (postgres:16 only ever means one thing, unlike
    # the runner images' content-hash tags, whose content we control and rebuild on change).
    # First sighting of a tag is a genuine Docker Hub pull (published here); every run after that
    # is a GHCR pull, same registry/credentials as the rest of this workflow already uses.
    #
    # This job only MIRRORS the bytes into GHCR. Job 5's own steps below re-tag the mirrored image
    # back to the exact literal string the test code passes to `new GenericContainer(...)` —
    # Testcontainers only pulls an image it doesn't already find locally, so a pre-seeded local tag
    # makes its own pull a no-op. Nothing in apps/ changes; the test files keep referencing
    # "postgres:16" etc. unmodified.
    #
    # CAVEAT: this mirrors whatever single-arch manifest `ubuntu-latest` (amd64) pulls, not the
    # upstream multi-arch index — fine today (every job in this workflow runs on `ubuntu-latest`),
    # but an arm64 self-hosted runner would need its own mirror pass.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Mirror each upstream tag to GHCR, once per tag
        run: |
          set -uo pipefail
          mirror() {
            upstream="$1"
            repo="${upstream%%:*}"
            tag="${upstream##*:}"
            mirror_ref="ghcr.io/commanderscp/mirror/${repo}:${tag}"
            # An ORG-namespaced repo ("minio/minio") is already fully qualified under docker.io;
            # only a single-segment OFFICIAL image ("postgres") lives under the implicit
            # `library/` namespace. Prefixing `library/` unconditionally — as this did before
            # minio was added — makes `docker pull docker.io/library/minio/minio` a 404.
            case "$repo" in
              */*) src="docker.io/${upstream}" ;;
              *)   src="docker.io/library/${upstream}" ;;
            esac
            if docker pull "$mirror_ref" >/dev/null 2>&1; then
              echo "cache hit: $mirror_ref already mirrored."
            else
              echo "cache miss: mirroring $src -> $mirror_ref"
              docker pull "$src"
              docker tag "$src" "$mirror_ref"
              docker push "$mirror_ref"
            fi
          }
          mirror postgres:16
          mirror nats:2.10
          mirror registry:2
          # `federation/delivery-s3.integration.test.ts` starts MinIO via GenericContainer inside
          # the sharded suite — it was missed when this job was written, so the REQUIRED integration
          # gate still had one live Docker Hub pull on its path, which is the exact failure mode
          # this job exists to remove.
          mirror minio/minio:RELEASE.2025-04-22T22-12-26Z

  prod-audit:
    name: "5y. Prod dependency audit (pnpm audit --prod, GHCR-mirrored advisory snapshot)"
    # `pnpm audit` appeared in no workflow and no script before this PR (BUILD_AND_TEST.md's
    # "Intended but not wired" list) — 5 real prod-dependency vulnerabilities (measured 2026-07-31:
    # 4 high, 1 moderate — @fastify/static path-traversal GHSA-83w8-p2f5-377r, find-my-way ReDoS,
    # transitive fast-uri and brace-expansion issues) sat ungated. That same doc names the blocker
    # precisely: "an unmirrored `pnpm audit` is a runtime call to the outside world, which is
    # exactly what charter principle 5 forbids CI to make" — every run would hit npm's advisory
    # endpoint live.
    #
    # Same "query once, publish to GHCR, reuse" shape as jobs 4c/4d/9a, keyed on a content hash of
    # pnpm-lock.yaml (the exact installed-package set is what the advisory query is over, so a
    # lockfile-unchanged run has nothing new to ask about). Cache hit: pull the snapshot this exact
    # lockfile already produced. Cache miss: query the registry ONCE, publish the raw `pnpm audit
    # --json` output as a scratch-image layer in GHCR so a later run — including a self-hosted
    # runner pointed at an internal GHCR mirror instead of the public registry — never needs to
    # reach npm directly.
    #
    # REMEDIATED (this PR), not just wired: find-my-way, fast-uri, and brace-expansion were all
    # transitive pins already inside their parents' declared semver ranges — a plain
    # `pnpm update --recursive` picked up the patched versions with zero source changes.
    # @fastify/static needed an actual major bump (9.3.0 -> 10.1.2, in apps/server/package.json);
    # its only breaking change between those majors is the `setHeaders(res)` -> `setHeaders(reply)`
    # signature, which this codebase's two registrations (apps/server/src/app.ts) don't use.
    # `pnpm audit --prod` is clean (0 high/critical) as of this PR, so job 5y is now wired into job
    # 5z's `needs:` for real, the same way this PR adds `helm-verify`.
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Compute the advisory-snapshot tag (content hash of pnpm-lock.yaml + ISO week)
        id: tag
        # THE WEEK COMPONENT IS THE POINT. Keyed on the lockfile ALONE (as this was), a snapshot
        # taken once was reused forever: a CVE disclosed tomorrow against a dependency pinned today
        # could NEVER red this gate, because nothing would ever re-query. That is the failure mode
        # a dependency-audit gate exists to catch, so the gate was structurally blind to it.
        #
        # The lockfile still keys it (a changed dependency set must be re-queried immediately); the
        # ISO week bounds staleness at 7 days. Weekly, not daily: the advisory endpoint is the ONE
        # network call in this job, and a daily key multiplies cold-start cost sevenfold for a
        # disclosure cadence that does not warrant it.
        #
        # AIR-GAP: a disconnected runner pre-seeds the week's snapshot into its internal GHCR the
        # same way it seeds every other mirrored artifact. On a cache miss it cannot serve, this job
        # FAILS rather than passing on stale data — fail-closed is the correct posture for a
        # security gate, and a silently-stale audit is worse than a red one.
        run: |
          echo "ref=ghcr.io/commanderscp/audit-db:$(sha256sum pnpm-lock.yaml | cut -c1-16)-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull the cached advisory snapshot, or query once on a cache miss and publish it
        run: |
          set -uo pipefail
          REF="${{ steps.tag.outputs.ref }}"
          mkdir -p /tmp/audit
          if docker pull "$REF" >/dev/null 2>&1; then
            echo "cache hit: $REF already in GHCR — reusing the snapshot queried when this lockfile was last pinned."
            # The trailing `true` is a COMMAND ARGUMENT, and it is load-bearing. The snapshot image
            # is `FROM scratch` + one COPY (see the cache-miss branch below), so it carries no CMD
            # and no ENTRYPOINT — and `docker create` REFUSES an image with no command:
            # "Error response from daemon: no command specified". The container is only ever a
            # handle for `docker cp`; it is never started, so the argument need not exist in the
            # image. (This is the same create -> cp -> rm seam `packages/plugins/managed-scan` uses,
            # which passes a real argv and so never hit this.)
            #
            # Fixing the PRODUCER instead — adding a CMD to the scratch Dockerfile below — would NOT
            # have been enough on its own: snapshot images already published to GHCR are immutable
            # and still carry no CMD, so every already-cached lockfile would stay broken until its
            # hash changed. The consumer-side fix repairs old and new snapshots alike.
            cid=$(docker create "$REF" true)
            docker cp "$cid:/audit.json" /tmp/audit/audit.json
            docker rm "$cid" >/dev/null
          else
            echo "cache miss: new lockfile or new ISO week. Querying the registry advisory endpoint ONCE (the only network call in this job) and publishing the result to GHCR."
            # `|| true` is REQUIRED on the command (pnpm audit exits non-zero merely BECAUSE it
            # found vulnerabilities — that is this job's normal, expected path and is graded below,
            # not here) but it also swallows a genuine failure: a network error, a registry 5xx, or
            # an auth failure all leave a truncated or empty audit.json behind. That file then
            # parsed to `{}`, `bad` computed as 0, and the gate PASSED GREEN having measured
            # nothing. The well-formedness assertion in the next step is what closes that hole; a
            # malformed snapshot must never reach GHCR to be cached and reused, so it is checked
            # BEFORE the publish.
            pnpm audit --prod --json > /tmp/audit/audit.json || true
            node -e '
              const fs = require("fs");
              let a;
              try {
                a = JSON.parse(fs.readFileSync("/tmp/audit/audit.json", "utf8"));
              } catch (e) {
                console.error("::error::the audit query produced unparseable JSON — treating as a FAILED query, not as zero vulnerabilities: " + e.message);
                process.exit(1);
              }
              const v = a && a.metadata && a.metadata.vulnerabilities;
              if (!v || typeof v !== "object") {
                console.error("::error::the audit output parsed but carries no metadata.vulnerabilities — the query did not complete. Refusing to cache or grade it.");
                process.exit(1);
              }
            '
            printf 'FROM scratch\nCOPY audit.json /audit.json\n' > /tmp/audit/Dockerfile
            docker build -t "$REF" /tmp/audit
            docker push "$REF"
          fi
      - name: Fail on any high/critical prod-dependency vulnerability in the snapshot
        run: |
          node -e '
            const fs = require("fs");
            let a;
            try {
              a = JSON.parse(fs.readFileSync("/tmp/audit/audit.json", "utf8"));
            } catch (e) {
              // A CACHED snapshot can be malformed too — an image published before the
              // well-formedness check above existed, or a truncated `docker cp`. Same rule: an
              // unreadable measurement is a FAILED gate, never a passed one.
              console.error("::error::the cached audit snapshot is unparseable — a gate that cannot read its evidence must fail, not pass: " + e.message);
              process.exit(1);
            }
            const v = a && a.metadata && a.metadata.vulnerabilities;
            if (!v || typeof v !== "object") {
              console.error("::error::the audit snapshot carries no metadata.vulnerabilities — nothing was measured. Failing closed.");
              process.exit(1);
            }
            console.log("prod vulnerabilities:", JSON.stringify(v));
            const bad = (v.high || 0) + (v.critical || 0);
            // MODERATE is REPORTED, NOT GATED — a deliberate choice, recorded here because the
            // silence read as an oversight. A moderate prod advisory is frequently unactionable at
            // disclosure (no patched version yet), and gating on it hands the ability to red `main`
            // to a third party unrelated to the change under test. High/critical is the blocking
            // line; the annotation keeps moderates visible so they are triaged rather than unseen.
            const moderate = v.moderate || 0;
            if (moderate > 0) {
              console.log("::warning::" + moderate + " MODERATE prod-dependency vulnerabilities (reported, not gated — see this job'"'"'s comment).");
            }
            if (bad > 0) {
              console.error("::error::" + bad + " high/critical prod-dependency vulnerabilities in the audit snapshot above.");
              process.exit(1);
            }
          '

  integration-shard:
    name: "5. Integration shard ${{ matrix.shard }}/2 (Testcontainers Postgres + real-Docker runners)"
    # LEVER 2: SHARDED across a 2-way matrix. vitest `--shard=i/2` deterministically splits the
    # integration test FILES across two independent jobs on two runners, halving wall-clock. The
    # `integration` aggregation gate below `needs:` this matrix so branch protection references ONE
    # stable check name instead of the per-shard names. (Combined with LEVER 3's per-worker parallel
    # forks WITHIN each shard, the two levers compose: files split across shards, then run in
    # parallel within a shard.)
    #
    # Needs a real Docker daemon for Testcontainers, plus the ability to create `--network none`
    # runner containers. `ubuntu-latest` ships a NATIVE Docker Engine (no DinD sidecar), which is a
    # simpler substrate for this than the homelab ARC runner it replaced. M7: `pnpm test:integration`
    # (turbo run test:integration) automatically picks up @scp/plugin-managed-iac's own
    # test:integration script too (turbo discovers it from that package's package.json, no separate
    # wiring needed) — the DoD-critical "launches a REAL scp-runner-iac container" test therefore
    # runs in THIS job, against the same daemon, rather than needing a second CI job. Every push/PR
    # (not main-only): this is a permanent regression test, same gating as the Testcontainers suite
    # it sits alongside.
    #
    # This job also makes the CRITICAL #1 air-gap guard (adversarial review of PR #15:
    # `deploy/airgap/src/install-sh-tamper.test.ts` — a bundle re-signed with an attacker's
    # keypair must be REJECTED against the real external `--pubkey`, exercised against the actual
    # `install.sh` subprocess, not a reimplementation) a REAL gate on every PR. That suite's
    # tool-dependent `describe` block probes `cosign`/`skopeo`/`helm` on PATH and SKIPS when any
    # are absent (see the test file's own comment) — which is what keeps it inert in the
    # deliberately tool-free unit-test job (job 4), where cosign and skopeo are absent.
    # `ubuntu-latest` pre-installs none of cosign/skopeo, and its helm is not the pinned one, so the
    # steps below install all three for real — pinned, not runner-supplied — before re-running
    # `@scp/airgap`'s suite explicitly (it's not part of the `test:integration` task graph — its
    # script is named `test`, and Turborepo only wires the `test:integration` task to packages
    # that declare that exact script name) — with all three tools genuinely on PATH, the tamper
    # scenario actually executes here instead of skipping.
    runs-on: ubuntu-latest
    needs: [static-checks, codegen-drift, unit-tests, runner-images, testcontainer-images]
    permissions:
      contents: read
      packages: read
    env:
      # THE LAST UNMIRRORED DOCKER HUB PULL ON THE REQUIRED GATE'S PATH. Testcontainers starts a
      # `testcontainers/ryuk` reaper sidecar by default, pulled from Docker Hub on every shard of
      # every run — so job 4d's mirror closed the postgres/nats/registry/minio holes while this one
      # stayed open, and a Hub timeout could still red 5z for a reason unrelated to the code.
      #
      # DISABLED rather than mirrored, deliberately: ryuk exists to garbage-collect leaked
      # containers on a LONG-LIVED host. A GitHub-hosted runner is a single-use VM destroyed when
      # the job ends, so there is nothing for it to reclaim. (A self-hosted runner is the case that
      # WOULD want it — hence disabled here in the job env, not globally in the test code.)
      TESTCONTAINERS_RYUK_DISABLED: "true"
    strategy:
      # fail-fast off: a failure in one shard must not cancel the other, so a red run still reports
      # every failing file across both shards (the aggregation gate fails if EITHER shard failed).
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: "Install Helm (BUILD_AND_TEST.md §1: 3.16+)"
        uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Install the PINNED cosign (the same binary the scp image ships)
        # PINNED, not `sigstore/cosign-installer@v3` (M17.3 E1). Two reasons the unpinned network
        # installer had to go: (1) it installed whatever cosign it felt like, so CI validated a
        # DIFFERENT binary than production runs — the tamper suite below is only meaningful if it
        # exercises the shipped one; (2) charter principle 5 wants CI offline-capable, and a
        # digest-pinned, content-addressed image pull can be served by a local mirror whereas an
        # unpinned release download cannot. The script extracts /ko-app/cosign from the pinned
        # image (tools/cosign/pin.env) and fails closed if `cosign version` != the pin.
        run: scripts/install-pinned-cosign.sh
      - name: Point @scp/airgap at the pinned cosign
        # Makes the resolution in deploy/airgap/src/cosign-bin.ts take the PINNED branch here
        # (static flag set + fail-closed version assertion), so CI exercises exactly the path the
        # runtime image takes. install.sh's own requirement is unaffected: it still finds an
        # EXTERNAL cosign on PATH, which is the trust model it must keep.
        run: echo "SCP_COSIGN_BIN=/usr/local/bin/cosign" >> "$GITHUB_ENV"
      - name: Install skopeo (BUILD_AND_TEST.md §1) — no-op if the runner already has it
        run: |
          command -v skopeo >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
      - name: Install the PINNED skopeo (the same binary+library closure the scp image vendors)
        # PINNED, not apt's (M15.5 c1/c3 — the M17.3 E1 argument, now for skopeo): apt gave the
        # (Ubuntu) runner skopeo 1.13.3, BELOW the documented 1.16+ floor (BUILD_AND_TEST.md §1) and
        # not the 1.22.2 the runtime image vendors — and the exact apt version is a property of
        # whatever Ubuntu the runner happens to be, which is precisely why this pin does not trust
        # it. That drift broke the M15.5(c) relay suite for
        # real: cosign v3 attaches image signatures under the OCI 1.1 referrers-FALLBACK tag (an
        # image index with artifactType children), which skopeo 1.13.3 cannot copy with
        # --preserve-digests ("Manifest list must be converted…cannot modify it"), so the relay's
        # signature discovery found nothing and correctly fail-closed. The script installs the
        # runtime image's own layout at /opt/scp (binary + library closure + wrapper), so
        # packages/cosign/src/skopeo-bin.ts resolves it as the VENDORED pin — fail-closed version
        # assertion included — exactly the resolution branch production takes. The apt skopeo
        # above deliberately STAYS on PATH: it is the "operator's own skopeo" the air-gap
        # install.sh suite exercises (probed, never version-asserted — see skopeo-bin.ts).
        run: scripts/install-pinned-skopeo.sh
      - run: pnpm build
      # LEVER 1: PULL the pre-built runner images (built + pushed by the `runner-images` job) so the
      # tests never `docker build` in CI. The tag formula is the SAME script the publish job ran, so
      # these refs resolve to the exact images now in GHCR. Exporting them into $GITHUB_ENV makes them
      # visible to the test step, where resolveRunnerImage (@scp/plugin-testkit) returns the ref
      # instead of building. (Local dev, with these env vars unset, still legacy-builds as before.)
      - name: Compute the content-hash runner image tags (same formula as the publish job)
        run: scripts/runner-image-tags.sh >> "$GITHUB_ENV"
      - name: Log in to GHCR and pull the pre-built runner images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$SCP_RUNNER_SCAN_IMAGE_REF"
          docker pull "$SCP_RUNNER_IAC_IMAGE_REF"
      # Pull the Testcontainer images (job 4d) from GHCR and re-tag them back to the literal
      # strings the integration suites pass to `new GenericContainer(...)` /
      # `new PostgreSqlContainer(...)` — Testcontainers only pulls an image it can't already find
      # locally, so this makes its own pull step a no-op and keeps the suite off Docker Hub.
      - name: Pull mirrored Testcontainer images and re-tag as the names the tests reference
        run: |
          set -uo pipefail
          for upstream in postgres:16 nats:2.10 registry:2 minio/minio:RELEASE.2025-04-22T22-12-26Z; do
            repo="${upstream%%:*}"
            tag="${upstream##*:}"
            mirror_ref="ghcr.io/commanderscp/mirror/${repo}:${tag}"
            docker pull "$mirror_ref"
            docker tag "$mirror_ref" "$upstream"
          done
      # LEVER 2: `--shard=i/2` (turbo forwards args after `--` to every test:integration task —
      # @scp/server AND @scp/plugin-managed-iac; both configs pass `--passWithNoTests`, so the
      # single-file managed-iac suite runs in whichever shard vitest assigns it and no-ops in the
      # other). vitest shards at FILE granularity, so shard 1/2 + shard 2/2 together cover every
      # file exactly once — verified locally (file counts sum to the full suite, none dropped or
      # doubled).
      - run: pnpm test:integration -- --shard=${{ matrix.shard }}/2
      # Explicit, not part of test:integration's task graph (see comment above) — this is the ONLY
      # place in CI these tool-dependent assertions run for real rather than skip. Runs EXACTLY ONCE
      # across the matrix (shard 1 only): it is not part of the sharded vitest suite, so running it
      # per shard would be pure duplication.
      - name: Air-gap install.sh tamper-rejection suite (CRITICAL #1 real gate — cosign/skopeo/helm now on PATH)
        if: ${{ matrix.shard == 1 }}
        run: pnpm --filter @scp/airgap test

  integration:
    name: "5z. Integration (aggregation gate)"
    # LEVER 2: a single, stable status-check name for branch protection to require, standing in for
    # the per-shard matrix jobs (whose names include the shard index). `if: always()` + an explicit
    # result check means this gate goes RED whenever any shard failed or was cancelled, rather than
    # being silently skipped.
    #
    # DONE (2026-07-24): `main` branch protection now requires exactly this check plus "3. Codegen
    # drift". Requiring 5z transitively covers static-checks, codegen-drift, unit-tests and
    # runner-images, because integration-shard `needs:` all four (plus testcontainer-images, added
    # this PR) — if any of them fails the matrix is skipped, `needs.integration-shard.result !=
    # "success"`, and this gate goes red. See §6.
    #
    # UPDATED (this PR): also `needs: [helm-verify, prod-audit]` directly. 4b was previously
    # reachable from nothing — a red 4b did not block merge despite that job's own comment claiming
    # it did (see the CORRECTION note on job 4b above). 5y (prod-audit) is net-new this PR; its own
    # 5 pre-existing findings were remediated in the same PR that adds the gate (see 5y's comment),
    # so it's wired in immediately rather than landing dark. Neither has another dependency
    # relationship with integration-shard, so both are added as sibling `needs:` entries here
    # rather than folded into that job's chain.
    needs: [integration-shard, helm-verify, prod-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard, helm-verify, and prod-audit to have succeeded
        run: |
          shards="${{ needs.integration-shard.result }}"
          helm="${{ needs.helm-verify.result }}"
          audit="${{ needs.prod-audit.result }}"
          echo "integration-shard matrix result: $shards"
          echo "helm-verify result: $helm"
          echo "prod-audit result: $audit"
          failed=0
          if [ "$shards" != "success" ]; then
            echo "::error::one or more integration shards did not succeed ($shards)"
            failed=1
          fi
          if [ "$helm" != "success" ]; then
            echo "::error::helm-verify (job 4b) did not succeed ($helm)"
            failed=1
          fi
          if [ "$audit" != "success" ]; then
            echo "::error::prod-audit (job 5y) did not succeed ($audit)"
            failed=1
          fi
          exit "$failed"

  e2e-m0:
    name: "7. E2E (M0 golden path, main only)"
    # Needs a real Docker daemon (compose), which `ubuntu-latest` provides. (Before the hosted-runner
    # swap this — and every e2e-* job below — had to name the `homelab-…-docker-build` label, because
    # the other homelab label had no daemon at all; there is now only one label and the "which runner
    # and why" note on each of these jobs is purely historical.)
    runs-on: ubuntu-latest
    needs: [static-checks, codegen-drift, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: bash scripts/e2e-m0.sh

  e2e-m4:
    name: "8. E2E (M4 governance golden path, main only)"
    # Same as e2e-m0: needs a real Docker daemon (compose).
    runs-on: ubuntu-latest
    needs: [static-checks, codegen-drift, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
