{{- if .Values.bundledExecutor.argoWorkflows.enabled -}}
{{- $w := .Values.bundledExecutor.argoWorkflows -}}
{{- if not $w.serverImage }}{{ fail "bundledExecutor.argoWorkflows.enabled=true but .serverImage is empty — the vendored, retargeted argocli image is required (set by the air-gap install.sh). Fail-closed." }}{{- end -}}
{{- if not $w.scpAccount }}{{ fail "bundledExecutor.argoWorkflows.enabled=true but .scpAccount is empty — SCP would have no identity to coordinate this backend as, and argo-server runs --auth-mode=client. Fail-closed." }}{{- end -}}
{{- if not $w.tlsSecretName }}{{ fail "bundledExecutor.argoWorkflows.enabled=true but .tlsSecretName is empty — argo-server would mint a NEW self-signed certificate on every start, which makes its CA unpinnable and breaks SCP's executorTls trust at the first restart. Fail-closed." }}{{- end -}}
{{- if not $w.controllerImage }}{{ fail "bundledExecutor.argoWorkflows.enabled=true but .controllerImage is empty — the vendored, retargeted workflow-controller image is required." }}{{- end -}}
{{- if not $w.vendoredServerImage }}{{ fail "bundledExecutor.argoWorkflows.vendoredServerImage is empty — this is the retarget SOURCE (the upstream ref the vendored file currently declares). Fail-closed rather than silently skip the retarget." }}{{- end -}}
{{- if not $w.vendoredControllerImage }}{{ fail "bundledExecutor.argoWorkflows.vendoredControllerImage is empty — same reasoning as vendoredServerImage." }}{{- end -}}
# =============================================================================================
# Bundled Argo Workflows (Mode B — bundled CI/build/test). Vendored, UNMODIFIED upstream v4.0.7
# rendered into {{ $w.namespace }} via commanderscp.renderVendoredBackend, with only the two images
# retargeted. SCP DEPLOYS it here; coordinating it (trigger/observe) is the generic pipeline
# executor's job (M10.6) — SCP never runs CI itself. NOTE: upstream install.yaml is 11 MB (over
# Helm's 5 MB per-file limit), so it is vendored SPLIT into 4 ordered <5 MB parts (their
# concatenation is byte-for-byte the original, sha256
# 4e7112cd10dbb5a03c33653cda7509bdb8e876dcc64cf050c4c387aa07bf8524) and reassembled here.
# =============================================================================================
{{/* THE PART COUNT IS DERIVED, NEVER HARDCODED (2026-09-25 review, finding 7). A hardcoded list of
     four names silently drops any part a future re-vendor adds (upstream's install.yaml grows past
     4 parts at the tool's own split threshold) and silently REASSEMBLES A STALE, ORPHANED PART if a
     future re-vendor SHRINKS the count (a leftover install-part-04.yaml from the previous version
     would still be globbed and appended, producing a manifest that is neither the old nor the new
     one). `.Files.Glob` finds whatever parts actually exist on disk right now; `sortAlpha` orders
     them correctly because every name is zero-padded to two digits (tools/vendor-refresh's own
     `partFileName` refuses to emit a name that would sort wrong). */}}
{{- $manifest := "" -}}
{{- $parts := dict -}}
{{- range $path, $bytes := .Files.Glob "vendor/argo-workflows/install-part-*.yaml" -}}
{{- $_ := set $parts $path (toString $bytes) -}}
{{- end -}}
{{- $partNames := keys $parts | sortAlpha -}}
{{- if eq (len $partNames) 0 -}}
{{- fail "commanderscp bundled argo-workflows: no vendor/argo-workflows/install-part-*.yaml files found — the vendored manifest is missing, was renamed, or the glob itself is broken. Fail-closed rather than render an empty backend." -}}
{{- end -}}
{{/* THE GLOB MUST FIND A CONTIGUOUS 01..N SEQUENCE, NEVER A GAP OR A LEFTOVER (2026-09-25 third
     re-review) — this is the render-time BACKSTOP for the property `tools/vendor-refresh`'s own
     re-vendor orchestrator is now responsible for maintaining (deleting a part number a shrunk
     re-vendor no longer needs). A stale `install-part-04.yaml` orphaned by a re-vendor that failed
     to delete it, or a `install-part-02.yaml` missing because ONE part failed to commit, both glob
     successfully — `.Files.Glob` has no idea what SHOULD be there, only what IS. Checking the
     SORTED names against the exact sequence `install-part-01.yaml`..`install-part-NN.yaml` is what
     catches either: a gap breaks the sequence at the missing number, and an orphan breaks it by
     adding a number beyond the true count. */}}
{{- range $i, $p := $partNames -}}
{{- $expected := printf "vendor/argo-workflows/install-part-%02d.yaml" (add $i 1) -}}
{{- if ne $p $expected -}}
{{- fail (printf "commanderscp bundled argo-workflows: found %d install-part-*.yaml file(s), but they are not a contiguous 01..%02d sequence — expected '%s' at position %d, found '%s'. A gap (a part failed to commit) or a leftover (a shrunk re-vendor failed to delete a stale part) would both produce a manifest that is neither the old nor the new one. Fail-closed rather than reassemble it." (len $partNames) (len $partNames) $expected (add $i 1) $p) -}}
{{- end -}}
{{- end -}}
{{- range $p := $partNames -}}
{{- $manifest = printf "%s\n---\n%s" $manifest (get $parts $p) -}}
{{- end -}}
{{- include "commanderscp.renderVendoredBackend" (dict
    "ctx" .
    "namespace" $w.namespace
    "component" "bundled-argo-workflows"
    "manifest" $manifest
    "replaces" (list
      (list $w.vendoredServerImage $w.serverImage)
      (list $w.vendoredControllerImage $w.controllerImage)
    )
    "resources" $w.resources
    "containerArgs" (dict "argo-server" (list (printf "--tls-certificate-secret-name=%s" $w.tlsSecretName)))
  ) }}

---
# =============================================================================================
# THE ACCOUNT SCP COORDINATES AS. Mirrors `bundledExecutor.argocd.scpAccount` (a scoped, non-admin
# account SCP mints in the backend and speaks through); this backend shipped without one, so there
# was no identity to bind a build-lane executor to at all.
#
# argo-server runs `--auth-mode=client`: it performs every Kubernetes action AS THE CALLER, so this
# Role is exactly what SCP's plugin calls and nothing wider. Derived endpoint by endpoint from
# packages/plugins/argo-workflows/src/index.ts rather than copied from upstream's roles:
#
#   POST   /api/v1/workflows/{ns}/submit            -> workflows: create   (+ workflowtemplates: get,
#                                                       since submit names a WorkflowTemplate)
#   GET    /api/v1/workflows/{ns}/{name}            -> workflows: get
#   GET    /api/v1/workflows/{ns}                   -> workflows: list
#   PUT    /api/v1/workflows/{ns}/{name}/terminate  -> workflows: update, patch
#   POST   /api/v1/cron-workflows/{ns}              -> cronworkflows: create
#   PUT    /api/v1/cron-workflows/{ns}/{id}         -> cronworkflows: update
#   DELETE /api/v1/cron-workflows/{ns}/{id}         -> cronworkflows: delete
#
# Deliberately ABSENT: `watch` (the plugin polls; it opens no watch), `delete` on workflows (abort
# terminates, it does not delete), and anything on pods/pods-exec/pods-log/secrets — those are
# argo-server's OWN ServiceAccount's business, not the caller's, and granting them here would hand
# SCP the ability to read every Secret in the namespace through the API it coordinates with.
# =============================================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $w.scpAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
---
# A LONG-LIVED token for that account. Kubernetes 1.24+ stopped auto-creating these, and the
# alternative (`kubectl create token --duration`) mints one that EXPIRES — which for a coordination
# platform means the build lane stops working at an arbitrary future date, with a 401 that looks
# like a permissions problem. A bound token Secret is the supported way to hold a durable
# credential for a ServiceAccount; the kubelet populates `.data.token`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $w.scpAccount }}-token
  namespace: {{ $w.namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ $w.scpAccount }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $w.scpAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["cronworkflows"]
    verbs: ["create", "get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $w.scpAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $w.scpAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ $w.scpAccount }}
    namespace: {{ $w.namespace }}
{{- end }}
