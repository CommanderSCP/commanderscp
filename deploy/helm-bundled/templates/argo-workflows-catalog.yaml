{{- if .Values.bundledExecutor.argoWorkflows.enabled -}}
{{- $w := .Values.bundledExecutor.argoWorkflows -}}
{{- $c := $w.catalog -}}
{{- if not $c.buildImage.builderImage }}{{ fail "bundledExecutor.argoWorkflows.catalog.buildImage.builderImage is empty — the vendored, retargetable rootless BuildKit image is required (the air-gap install.sh sets it). Fail-closed." }}{{- end -}}
{{- if not $c.buildImage.gitImage }}{{ fail "bundledExecutor.argoWorkflows.catalog.buildImage.gitImage is empty — the vendored, retargetable git image is required. Fail-closed." }}{{- end -}}
# =============================================================================================
# THE SHIPPED BUILD CATALOG (owner decision 2026-09-20: "make it a catalog template SCP ships").
#
# One vetted, PARAMETERISED template every organization gets, rather than a build definition each
# team authors per component. That is only possible because a build-lane trigger now carries its
# source identity and destination (#398): before it, `parameters` came solely from a campaign
# recipe, so a shipped template would have received no repo, no commit and no destination and the
# only workable shape was one hardcoded template per component — a catalog in name only.
#
# VERSIONED IN THE NAME, deliberately. `WorkflowRefSchema` says a workflow is identified by
# repo+branch+path+commitSha and "never a bare template name" (D18), because a bare name cannot
# tell you WHICH definition ran. A shipped template has no tenant-visible repo to pin to, so the
# version moves into the name: `scp-build-image-v1` is a name AND a pin. A change to the build
# steps ships as `-v2` beside it, and existing bindings keep running what they were bound to
# rather than silently acquiring new behaviour.
#
# ---------------------------------------------------------------------------------------------
# WHY ROOTLESS BUILDKIT, AND WHAT IT COSTS (owner decision 2026-09-21).
#
# `promotion-and-execution-model.md` specifies "Images use Kaniko/Buildkit" for this hop. Three
# builders were tried on this cluster; the choice is a measurement, not a preference.
#
#   buildah   — CANNOT build here. Extracting the first layer of any base image dies with
#               `remount /, flags: 0x44000: permission denied`, because containers/storage makes
#               `/` rprivate before chroot-extracting and the container's `/` belongs to the
#               PARENT mount namespace. Only `privileged: true` would fix it, which hands a pod
#               running the TENANT'S OWN Dockerfile the node's kernel.
#   kaniko    — works, and needs no relaxation at all (it extracts layers in userspace). But
#               Google ARCHIVED it in June 2025 and ships no CVE patches. Chainguard's fork is
#               genuinely maintained, and publishes SOURCE ONLY — `cgr.dev/chainguard/kaniko` is
#               403 Forbidden even on `:latest`, and nothing is mirrored to ghcr or release
#               assets. "Maintained kaniko" therefore means building and re-building kaniko
#               ourselves forever. Owner ruled out the unmaintained image; the fork's cost was
#               judged higher than the relaxations below.
#   buildkit  — chosen. moby/buildkit is the most actively maintained builder there is, and the
#               rootless image is freely pullable, so it can be vendored like any other backend.
#
# THE PRICE, MEASURED RATHER THAN COPIED. Every published recipe for rootless BuildKit on
# Kubernetes lists `procMount: Unmasked`. That is WRONG here and actively harmful: Kubernetes now
# requires `hostUsers: false` alongside it, and that breaks rootlesskit's own uid mapping
# (`newuidmap: write to uid_map failed: Operation not permitted`). It is not set below.
#
# What IS required was established by building the same Dockerfile under one varied setting at a
# time. Each of these was observed to BREAK the build when hardened, so each is load-bearing:
#
#   seccompProfile: Unconfined      RuntimeDefault blocks the clone/unshare rootlesskit needs
#                                   (`fork/exec /proc/self/exe: operation not permitted`).
#   appArmorProfile: Unconfined     containerd's default profile denies sharing the mount of `/`
#                                   (`failed to share mount point: /: permission denied`) — the
#                                   same denial that makes buildah impossible.
#   allowPrivilegeEscalation: true  `no_new_privs` voids the file capabilities on `newuidmap`
#                                   (`newuidmap: Could not set caps`). Adding SETUID/SETGID does
#                                   NOT substitute: for a non-root uid they land in the bounding
#                                   set with no ambient caps, and it still fails.
#   capabilities SETUID, SETGID     retained for `newuidmap`/`newgidmap`; `drop: [ALL]` alone
#                                   fails with `newuidmap: operation not permitted`.
#
# And what is NOT given up, because it was measured to be unnecessary: the container still runs
# NON-ROOT as uid 1000, still has `readOnlyRootFilesystem: true`, still drops every capability
# but the two above, is never privileged, and mounts no container runtime socket. The writable
# state lives entirely on emptyDirs that vanish with the pod.
#
# THE HONEST RESIDUAL RISK: `--oci-worker-no-process-sandbox` means the Dockerfile's RUN steps
# share a namespace with buildkitd rather than being sandboxed from it. A hostile Dockerfile can
# therefore interfere with its OWN build. It cannot reach the node, the API SCP coordinates, or
# another build: the pod is one-shot, its token grants only `workflowtaskresults`, and the only
# credential present is the push secret for the image being built. For genuinely untrusted
# tenant Dockerfiles, building kaniko from the Chainguard fork remains the stronger posture.
#
# NO CONTAINER RUNTIME SOCKET, and this is enforced rather than intended: `tools/helm-verify`
# scans the RAW bundled render for the well-known runtime socket paths and fails the build on any
# of them — "a vendored backend mounting a container runtime socket is the same escape, one chart
# along". (That scan is a plain substring match over the rendered text, so even NAMING those paths
# in a comment trips it. This paragraph used to list them and turned the gate red; the list lives
# in RUNTIME_SOCKET_PATTERNS in tools/helm-verify/src/verify.ts, which is the one place it should.)
# =============================================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: scp-build-image-v1
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: build-image
    commanderscp.io/catalog-version: v1
spec:
  # A DEDICATED, NEAR-POWERLESS IDENTITY — deliberately NOT `scpAccount`. That account can create
  # and terminate workflows, and this pod runs the tenant's own Dockerfile: mounting a token with
  # that authority would let a malicious build reach the very API SCP coordinates through.
  #
  # Its Role grants `workflowtaskresults: create, patch` and NOTHING else. That is not a choice —
  # it is the floor. `automountServiceAccountToken: false` was tried first and Argo refused the
  # workflow outright ("executor.serviceAccountName must not be empty if
  # automountServiceAccountToken is false"): the emissary executor reports step status back through
  # that resource, so a build pod cannot be tokenless. The vendored bundle ships no role granting
  # it, so this template brings its own, scoped to the one verb pair the executor needs.
  #
  # What a malicious build can therefore do with the token it can read: write its own task results.
  # Not create a workflow, not read a Secret, not reach anything SCP coordinates.
  serviceAccountName: {{ $c.buildServiceAccount }}
  entrypoint: build-and-push
  # WHAT SCP SENDS (apps/server/src/coordination/build-trigger-parameters.ts). Every one of these
  # is something SCP already held and passed on; none is resolved by this template.
  #
  # The four with no default are REQUIRED: Argo refuses to submit without them. That is the point
  # — #398 omits an absent key rather than sending it empty, so a missing `sourceCommit` refuses
  # the run instead of building whatever HEAD happens to be. A refused run beats a wrong artifact.
  arguments:
    parameters:
      - name: sourceRepo
      - name: sourceCommit
      - name: imageRepository
      # THE FULLY-FORMED PUSH TARGET (`host/repository`), assembled by SCP. Required, and with no
      # default ON PURPOSE: a default would mean a component whose registry SCP could not resolve
      # pushes to someone else's registry rather than refusing.
      - name: imageDestination
      - name: registryUrl
        value: https://ghcr.io
      # WHERE THIS COMPONENT'S DOCKERFILE IS, relative to the repo root. A monorepo puts each
      # component's under its own directory (`apps/profile-web/Dockerfile`), so this is a fact
      # about the COMPONENT and arrives as a parameter — SCP reads it off the component's own
      # `properties.dockerfile`. The default below is the single-service repo case; carrying it
      # only in chart values would force every component in an organization to share one path.
      - name: dockerfile
        value: {{ $c.buildImage.dockerfile }}
      - name: sourceRef
        value: ""
      - name: registryName
        value: ""
      - name: changeObjectId
        value: ""
  templates:
    # ONE POD, NOT TWO STEPS. An earlier revision made fetch and build separate steps passing the
    # checkout as an Argo ARTIFACT — which Argo rejected outright ("inputs.artifacts.source was not
    # supplied") and which would have been wrong even once wired: artifact passing between steps
    # requires a configured artifact repository (S3/MinIO/…), and a template every organization
    # gets must not assume one exists. An init container sharing an `emptyDir` with the builder
    # needs no repository, no PVC and no dynamic provisioning.
    - name: build-and-push
      inputs:
        parameters:
          - name: sourceRepo
          - name: sourceCommit
          - name: imageRepository
          - name: imageDestination
          - name: registryUrl
          - name: dockerfile
          - name: sourceRef
          - name: registryName
          - name: changeObjectId
      # fsGroup, or nothing below works: an emptyDir is created root-owned, and with
      # `readOnlyRootFilesystem: true` these mounts are the ONLY writable paths the build has.
      securityContext:
        fsGroup: {{ $c.buildImage.runAsUser }}
      # EVERY WRITABLE PATH BUILDKIT NEEDS, and no more. Each was found by running the build and
      # reading what it was denied — not by guessing:
      #   workspace  the source checkout, buildkit's own state (--root) and DOCKER_CONFIG
      #   tmp        `buildctl-daemonless.sh` calls mktemp before any env var can redirect it
      #   xdg        the daemon's socket, at the $XDG_RUNTIME_DIR the image compiles in
      #   home-local rootlesskit resolves the home dir from /etc/passwd and IGNORES $HOME, so it
      #              insists on /home/user/.local/tmp. Mounted at `.local` rather than at
      #              `/home/user`, because the image ships a root-owned `.local` that a mount one
      #              level up does not hide.
      volumes:
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: xdg
          emptyDir: {}
        - name: home-local
          emptyDir: {}
      # ---- 1. SOURCE, PINNED TO THE COMMIT ---------------------------------------------------
      # Fetched by COMMIT, never by branch: the artifact SCP will scan and sign has to correspond
      # to a known revision, and `sourceRef` is carried for provenance rather than for checkout.
      # A branch name would let the tree move between the trigger and the fetch.
      initContainers:
        - name: fetch-source
          image: {{ $c.buildImage.gitImage }}
          mirrorVolumeMounts: true
          command: [sh, -eu, -c]
          args:
            - |
              set -eu
              repo="$0"; commit="$1"
              : "${GIT_TOKEN:=}"
              base="{{ include "commanderscp.sourceBaseUrl" $c.buildImage.sourceHost }}"
              scheme="${base%%://*}"; authority="${base#*://}"
              if [ -n "$GIT_TOKEN" ]; then
                remote="${scheme}://x-access-token:${GIT_TOKEN}@${authority}/${repo}.git"
              else
                remote="${base}/${repo}.git"
              fi
              mkdir -p /work/src && cd /work/src
              git init -q .
              git remote add origin "$remote"
              git fetch -q --depth 1 origin "$commit"
              git checkout -q FETCH_HEAD
              # Prove what was fetched, so the log records the revision rather than the request.
              echo "fetched $(git rev-parse HEAD) from ${repo}"
            - "{{`{{inputs.parameters.sourceRepo}}`}}"
            - "{{`{{inputs.parameters.sourceCommit}}`}}"
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.credentialsSecret }}
                  key: gitToken
                  optional: true
          resources:
            {{- toYaml $c.buildImage.resources.fetch | nindent 12 }}
      # ---- 2. BUILD + PUSH, ROOTLESS ---------------------------------------------------------
      container:
        image: {{ $c.buildImage.builderImage }}
        # See the header for why each of these four is load-bearing and what was measured. The
        # short version: rootlesskit has to create a user namespace and map uids into it, and
        # every one of seccomp RuntimeDefault, the default AppArmor profile, no_new_privs and
        # `drop: [ALL]` independently prevents that. Non-root, read-only root filesystem and the
        # absence of any runtime socket are kept — those cost nothing.
        securityContext:
          runAsUser: {{ $c.buildImage.runAsUser }}
          runAsGroup: {{ $c.buildImage.runAsUser }}
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
          capabilities:
            drop: ["ALL"]
            add: ["SETUID", "SETGID"]
        volumeMounts:
          - name: workspace
            mountPath: /work
          - name: tmp
            mountPath: /tmp
          - name: xdg
            mountPath: /run/user/{{ $c.buildImage.runAsUser }}
          - name: home-local
            mountPath: /home/user/.local
        command: [sh, -eu, -c]
        args:
          - |
            set -eu
            destination="$0"; commit="$1"; dockerfile="$2"
            # The registry HOST is the first path segment of the destination SCP assembled. Taken
            # from there rather than re-derived from registryUrl, so the host we AUTHENTICATE to
            # is by construction the host we PUSH to.
            host="${destination%%/*}"
            tag="${destination}:${commit}"
            mkdir -p "$HOME/.local/tmp" "$HOME/.local/share/buildkit" "$DOCKER_CONFIG"
            cd /work/src
            [ -f "$dockerfile" ] || {
              echo "no $dockerfile in this repository at ${commit}. This catalog template builds a" >&2
              echo "Dockerfile-based image; set the component's properties.dockerfile if it lives" >&2
              echo "somewhere other than the repository root (a monorepo usually does), or use a" >&2
              echo "template of your own if it does not build from a Dockerfile at all." >&2
              exit 2
            }
            # THE PUSH CREDENTIAL IS BOUND TO ONE HOST (M29.5, ADR-0063). The destination is
            # assembled by SCP from a registry object an organization writes, so without a binding
            # a registry re-pointed at another host would be handed this Secret's token. With
            # `registryHost` set (entered through SCP with the token), any other host is refused
            # BEFORE the credential is written anywhere.
            if [ -n "${REGISTRY_HOST:-}" ] && [ "$host" != "$REGISTRY_HOST" ]; then
              echo "the push credential in {{ $c.credentialsSecret }} is bound to ${REGISTRY_HOST}, and this" >&2
              echo "build's destination is ${host} — refusing to present it there" >&2
              exit 2
            fi
            [ -n "${REGISTRY_HOST:-}" ] || echo "warning: the push credential in {{ $c.credentialsSecret }} is not bound to a registry host (set registryHost through SCP)" >&2
            # An in-cluster Service (the bundled Gitea) is plain HTTP behind its NetworkPolicy, the
            # way SCP itself reaches it; every other host is pushed to over TLS only.
            insecure=""
            case "$host" in
              *.svc|*.svc:*|*.svc.cluster.local|*.svc.cluster.local:*) insecure=",registry.insecure=true" ;;
            esac
            if [ -n "${REGISTRY_USERNAME:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
              # buildkit reads registry credentials from DOCKER_CONFIG; there is no `login` verb.
              # Written with printf rather than a heredoc so the password never becomes a token
              # the shell might re-split, and 0600 because $DOCKER_CONFIG is a shared emptyDir.
              umask 077
              printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
                "$host" \
                "$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 -w0)" \
                > "$DOCKER_CONFIG/config.json"
            else
              echo "no registry credentials in secret {{ $c.credentialsSecret }} — refusing to build" >&2
              echo "an image that cannot be pushed, rather than failing after the expensive step" >&2
              exit 2
            fi
            # CONTEXT IS THE REPO ROOT, dockerfile path relative to it — which is what a monorepo
            # needs: apps/profile-web/Dockerfile routinely COPYs from packages/ and the workspace
            # lockfile at the root, so a context narrowed to the component's directory would fail
            # to resolve them. `--opt filename` carries the path within that context.
            buildctl-daemonless.sh build \
              --frontend dockerfile.v0 \
              --local context=/work/src \
              --local dockerfile=/work/src \
              --opt filename="$dockerfile" \
              --output "type=image,name=${tag},push=true${insecure}"
            echo "pushed $tag"
          - "{{`{{inputs.parameters.imageDestination}}`}}"
          - "{{`{{inputs.parameters.sourceCommit}}`}}"
          - "{{`{{inputs.parameters.dockerfile}}`}}"
        env:
          # --root keeps buildkit's layer store on the workspace emptyDir rather than the
          # container's writable layer, which `readOnlyRootFilesystem: true` denies outright.
          - name: BUILDKITD_FLAGS
            value: "--oci-worker-no-process-sandbox --root /work/buildkit"
          - name: DOCKER_CONFIG
            value: /work/.docker
          - name: REGISTRY_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryUsername
                optional: true
          - name: REGISTRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryPassword
                optional: true
          - name: REGISTRY_HOST
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryHost
                optional: true
        resources:
          {{- toYaml $c.buildImage.resources.build | nindent 10 }}
{{- if $c.buildRpm.builderImage }}
---
# =============================================================================================
# scp-build-rpm-v1 — THE SHIPPED RPM BUILD (M28.1, ADR-0053).
#
# SRPM from the component's spec, RPM from that SRPM, and a PUT of each binary RPM to the
# package-repo destination SCP derived (`rpmUploadUrl` — a `registry` whose `packageFormats`
# includes `rpm`, reached by the component's `publishes_to` edge; D1). Versioned in the name for
# the same reason `scp-build-image-v1` is.
#
# OFF UNTIL THE OPERATOR NAMES ITS IMAGE. `scp-builder-rpm` is first-party (no maintained public
# image ships rpmbuild — see apps/builder-rpm/Dockerfile), so there is no upstream ref a connected
# install could default to. The air-gap install.sh sets it from the bundle; a connected install
# sets it to the published ref. Unset, this template simply does not exist, and a binding naming
# it is refused by Argo at submit — the same shape as every managed runner being off until its
# image is supplied, and never a template that fails at its last step.
#
# ---------------------------------------------------------------------------------------------
# THE SECURITY CONTEXT, MEASURED THE WAY THE IMAGE TEMPLATE'S WAS — AND THE ANSWER IS "NONE".
#
# `scp-build-image-v1` carries four relaxations because rootless BuildKit must create a user
# namespace. rpmbuild creates nothing of the kind: it is a process that reads a tree and writes
# files. So the method was copied, not the settings: the build was run under the fully hardened
# profile and each denial read, rather than starting from BuildKit's list and removing items.
#
# Run as uid 1000, root filesystem READ-ONLY, every capability dropped, no_new_privs set, and the
# runtime's default seccomp and AppArmor profiles (measured 2026-09-23 with docker's defaults —
# the same RuntimeDefault class — building and publishing a compiled C package end to end). It
# was denied exactly two things, both writes, and both were fixed by pointing the write at the
# workspace rather than by relaxing anything:
#
#   `/var/tmp/rpm-tmp.*`  rpmbuild's scriptlet files      -> `--define _tmppath /work/tmp`
#   `/tmp/find-debuginfo.*` debuginfo extraction mktemp   -> `TMPDIR=/work/tmp`
#
# So nothing below is relaxed, and `tools/helm-verify` asserts that it stays that way: a later
# edit that adds a capability or unsets `readOnlyRootFilesystem` here is a regression, not a
# tuning. NOT yet measured on the cluster's own runtime (the image template's four were): that
# needs a cluster apply, which is an owner action.
#
# What an RPM build can still do: run the spec's `%build` — arbitrary code from the tenant's own
# repository — as uid 1000 in a one-shot pod, whose token grants only `workflowtaskresults` (the
# same `scp-build` identity as the image template) and whose only credential is the package push
# secret. That is the same residual as a Dockerfile's RUN steps, without the shared-namespace
# caveat BuildKit's `--oci-worker-no-process-sandbox` adds.
# =============================================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: scp-build-rpm-v1
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: build-rpm
    commanderscp.io/catalog-version: v1
spec:
  # The same near-powerless identity as scp-build-image-v1, for the same reason: this pod runs
  # the tenant's own `%build`.
  serviceAccountName: {{ $c.buildServiceAccount }}
  entrypoint: build-and-publish
  # WHAT SCP SENDS for an `rpm` Type (build-trigger-parameters.ts). EVERY key it can send is
  # declared here — an undeclared one would be refused at submit — and the e2e test
  # (`rpm-build-lane.integration.test.ts`) fails if the derivation ever emits a key this list does
  # not name. The four with no default are REQUIRED, and Argo refuses to submit without them:
  #   sourceRepo / sourceCommit  what to build, pinned to a commit
  #   rpmSpec                    the component's `properties.rpmSpec`. NO DEFAULT, unlike the
  #                              image template's `Dockerfile`: a spec has no conventional name,
  #                              so a default would be a guessed file.
  #   rpmUploadUrl               assembled by SCP; no default, so an unresolvable destination
  #                              refuses rather than publishing somewhere else.
  arguments:
    parameters:
      - name: sourceRepo
      - name: sourceCommit
      - name: rpmSpec
      - name: rpmUploadUrl
      - name: rpmRepositoryUrl
        value: ""
      - name: packageRepository
        value: ""
      - name: registryUrl
        value: ""
      - name: registryName
        value: ""
      - name: sourceRef
        value: ""
      - name: changeObjectId
        value: ""
  templates:
    - name: build-and-publish
      inputs:
        parameters:
          - name: sourceRepo
          - name: sourceCommit
          - name: rpmSpec
          - name: rpmUploadUrl
          - name: rpmRepositoryUrl
          - name: packageRepository
          - name: registryUrl
          - name: registryName
          - name: sourceRef
          - name: changeObjectId
      securityContext:
        fsGroup: 1000
      # ONE writable path. rpmbuild's topdir, its temp files, $HOME and the checkout all live on
      # it — the image template needs four mounts because rootlesskit hardcodes three of its paths.
      volumes:
        - name: workspace
          emptyDir: {}
      # ---- 1. SOURCE, PINNED TO THE COMMIT ---------------------------------------------------
      # IDENTICAL to scp-build-image-v1's fetch-source, and `tools/helm-verify` asserts it stays
      # identical: fetching by commit rather than by branch is the property that makes the
      # published package correspond to a known revision, and two copies of it must not drift.
      initContainers:
        - name: fetch-source
          image: {{ $c.buildImage.gitImage }}
          mirrorVolumeMounts: true
          command: [sh, -eu, -c]
          args:
            - |
              set -eu
              repo="$0"; commit="$1"
              : "${GIT_TOKEN:=}"
              base="{{ include "commanderscp.sourceBaseUrl" $c.buildImage.sourceHost }}"
              scheme="${base%%://*}"; authority="${base#*://}"
              if [ -n "$GIT_TOKEN" ]; then
                remote="${scheme}://x-access-token:${GIT_TOKEN}@${authority}/${repo}.git"
              else
                remote="${base}/${repo}.git"
              fi
              mkdir -p /work/src && cd /work/src
              git init -q .
              git remote add origin "$remote"
              git fetch -q --depth 1 origin "$commit"
              git checkout -q FETCH_HEAD
              # Prove what was fetched, so the log records the revision rather than the request.
              echo "fetched $(git rev-parse HEAD) from ${repo}"
            - "{{`{{inputs.parameters.sourceRepo}}`}}"
            - "{{`{{inputs.parameters.sourceCommit}}`}}"
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.credentialsSecret }}
                  key: gitToken
                  optional: true
          resources:
            {{- toYaml $c.buildImage.resources.fetch | nindent 12 }}
      # ---- 2. SRPM -> RPM -> PUBLISH, UNPRIVILEGED --------------------------------------------
      # The script is `apps/builder-rpm/build-rpm.sh`, baked into the image as
      # /usr/local/bin/scp-build-rpm, so the bytes that ship are the bytes the real-counterparty
      # test runs against a real Gitea. Parameters arrive POSITIONALLY (`args`), never
      # interpolated into shell source.
      container:
        image: {{ $c.buildRpm.builderImage }}
        command: [/usr/local/bin/scp-build-rpm]
        args:
          - "{{`{{inputs.parameters.rpmSpec}}`}}"
          - "{{`{{inputs.parameters.rpmUploadUrl}}`}}"
          - "{{`{{inputs.parameters.sourceCommit}}`}}"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: workspace
            mountPath: /work
        env:
          - name: SCP_SOURCE_DIR
            value: /work/src
          - name: SCP_WORK_DIR
            value: /work
          # The SAME Secret and keys as the image template's registry push. A unified Gitea
          # (ADR-0012) takes one identity for its OCI and its RPM registry, and SCP holds neither:
          # the operator creates this Secret, and only the build pod reads it.
          - name: REGISTRY_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryUsername
                optional: true
          - name: REGISTRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryPassword
                optional: true
          # M29.5: the host the credential is bound to (build-rpm.sh refuses any other).
          - name: REGISTRY_HOST
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryHost
                optional: true
        resources:
          {{- toYaml $c.buildRpm.resources.build | nindent 10 }}
{{- end }}
---
# The near-powerless identity above, and the one grant Argo's executor cannot run without.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.buildServiceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: build-image
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $c.buildServiceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
rules:
  # THE EXECUTOR'S FLOOR, and the whole of it. `create` + `patch` on workflowtaskresults is how the
  # emissary executor reports a step's outcome. Anything more would be authority a tenant's own
  # Dockerfile could reach.
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $c.buildServiceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $c.buildServiceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ $c.buildServiceAccount }}
    namespace: {{ $w.namespace }}
{{- $i := $c.infra }}
{{- if $i.stateBackend.type }}
{{- if not $i.image }}{{ fail "bundledExecutor.argoWorkflows.catalog.infra.stateBackend.type is set but infra.image is empty — the infra templates run the scp-runner-iac image (the air-gap install.sh sets it; a connected install names the published ref). Fail-closed." }}{{- end }}
{{- if not (regexMatch "^[a-z][a-z0-9_]*$" $i.stateBackend.type) }}{{ fail (printf "bundledExecutor.argoWorkflows.catalog.infra.stateBackend.type '%s' is not an OpenTofu backend name. Fail-closed." $i.stateBackend.type) }}{{- end }}
---
# =============================================================================================
# INFRASTRUCTURE BUILDOUT FOR AN ENVIRONMENT (M28.3, ADR-0056): scp-infra-plan-v1 and
# scp-infra-apply-v1.
#
# D2: infrastructure executes as Argo Workflows catalog templates, PLAN → APPROVE → APPLY, and
# CommanderSCP only triggers and observes them. The approval is not in these templates. It is the
# change lifecycle SCP already has: the plan runs as one change, its digest and tally come back as
# evidence, and ACCEPTING that change is approving that plan (the existing accept gate, quorum and
# all). An apply is a second change naming the accepted plan, and SCP refuses to trigger
# scp-infra-apply-v1 at all unless that plan is accepted, is the latest plan for this target, and
# has not already been applied — `infra-lane-trigger-parameters.ts`, before `trigger()`.
#
# The template's own half of the binding: apply re-plans at the same commit and applies ONLY if the
# re-plan's digest is the approved one (files/scp-infra.sh says why it re-plans rather than storing
# a plan file). A plan approved and then outrun by a change in state is refused here, not applied.
#
# BOTH TEMPLATES RUN ONE SCRIPT, shipped from files/scp-infra.sh in the ConfigMap below, in the
# scp-runner-iac image — the same bytes `infra-lane.integration.test.ts` runs in the same image.
# Parameters reach it POSITIONALLY, never interpolated into shell source.
#
# FULLY HARDENED, and `tools/helm-verify` holds it there: non-root, read-only root filesystem, no
# privilege escalation, RuntimeDefault seccomp, every capability dropped. tofu, git and jq need no
# relaxation; everything they write lives on one emptyDir.
# =============================================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: scp-infra-v1
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: infra
    commanderscp.io/catalog-version: v1
data:
  scp-infra.sh: |
    {{- .Files.Get "files/scp-infra.sh" | nindent 4 }}
  # The operator's NON-SECRET backend settings, one `key = value` per line (values JSON-encoded,
  # which is valid HCL for strings, numbers and booleans). Secret settings go in credentialsSecret.
  backend.tfbackend: |
    {{- range $k, $v := $i.stateBackend.config }}
    {{- if not (regexMatch "^[a-z_][a-z0-9_]*$" $k) }}{{ fail (printf "stateBackend.config key '%s' is not a backend argument name. Fail-closed." $k) }}{{- end }}
    {{ $k }} = {{ toJson $v }}
    {{- end }}
  tofurc: |
    {{- $i.cliConfig | nindent 4 }}
{{- range $phase := list "plan" "apply" }}
{{- $p := index $i $phase }}
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: scp-infra-{{ $phase }}-v1
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: infra-{{ $phase }}
    commanderscp.io/catalog-version: v1
spec:
  # ONE IDENTITY PER PHASE, and neither is the build identity. A PLAN runs the repository's code
  # (providers, `data "external"`) before anyone has approved anything, so the plan identity and its
  # Secret must be READ-ONLY for the cloud; only the apply identity — reached solely through SCP's
  # apply gate — may change infrastructure. Cloud authority an operator binds by workload identity
  # to one of these never reaches the other, nor a pod running a tenant's Dockerfile.
  serviceAccountName: {{ $p.serviceAccount }}
  entrypoint: {{ $phase }}
  activeDeadlineSeconds: {{ $i.activeDeadlineSeconds }}
  # ONE RUN PER STATE WORKSPACE AT A TIME, across both templates: a plan and an apply of one
  # workspace, or two applies of different plans, queue behind each other instead of racing the
  # backend's lock. `synchronization.mutexes` is in the vendored v4.0.7 Workflow CRD ("v3.6 and
  # after"); a parameterised mutex name is Argo's documented form — not exercised by a live
  # controller in this repo.
  synchronization:
    mutexes:
      - name: "scp-infra-{{`{{workflow.parameters.stateWorkspace}}`}}"
  # WHAT SCP SENDS (apps/server/src/coordination/infra-lane-trigger-parameters.ts). The ones with
  # no default are REQUIRED and Argo refuses to submit without them — above all `planDigest` on
  # apply, which SCP sends only for an accepted, current, unapplied plan.
  arguments:
    parameters:
      - name: environment
      - name: stateWorkspace
      - name: sourceRepo
      - name: sourceCommit
      {{- if eq $phase "apply" }}
      - name: planDigest
      - name: planChangeObjectId
        value: ""
      {{- end }}
      - name: infraPath
        value: "."
      - name: region
        value: ""
      - name: sourceRef
        value: ""
      - name: changeObjectId
        value: ""
      - name: targetObjectId
        value: ""
  templates:
    - name: {{ $phase }}
      inputs:
        parameters:
          - name: environment
          - name: stateWorkspace
          - name: sourceRepo
          - name: sourceCommit
          {{- if eq $phase "apply" }}
          - name: planDigest
          - name: planChangeObjectId
          {{- end }}
          - name: infraPath
          - name: region
          - name: sourceRef
          - name: changeObjectId
          - name: targetObjectId
      securityContext:
        fsGroup: {{ $i.runAsUser }}
      volumes:
        - name: work
          emptyDir: {}
        - name: scp-infra
          configMap:
            name: scp-infra-v1
      # THE EVIDENCE CHANNEL. Global outputs land on the Workflow's own `status.outputs`, which is
      # what `@scp/plugin-argo-workflows`'s status() already fetches — so the digest and tally
      # reach SCP as `observed.plan` with no second call and no artifact repository.
      outputs:
        parameters:
          - name: planDigest
            globalName: scpPlanDigest
            valueFrom:
              path: /work/out/planDigest
          - name: planAdd
            globalName: scpPlanAdd
            valueFrom:
              path: /work/out/planAdd
          - name: planChange
            globalName: scpPlanChange
            valueFrom:
              path: /work/out/planChange
          - name: planDestroy
            globalName: scpPlanDestroy
            valueFrom:
              path: /work/out/planDestroy
          - name: applied
            globalName: scpPlanApplied
            valueFrom:
              path: /work/out/applied
      container:
        image: {{ $i.image }}
        command: [bash, /scp/scp-infra.sh]
        args:
          - {{ $phase }}
          - "{{`{{inputs.parameters.environment}}`}}"
          - "{{`{{inputs.parameters.stateWorkspace}}`}}"
          - "{{`{{inputs.parameters.sourceRepo}}`}}"
          - "{{`{{inputs.parameters.sourceCommit}}`}}"
          - "{{`{{inputs.parameters.infraPath}}`}}"
          {{- if eq $phase "apply" }}
          - "{{`{{inputs.parameters.planDigest}}`}}"
          {{- end }}
        securityContext:
          runAsUser: {{ $i.runAsUser }}
          runAsGroup: {{ $i.runAsUser }}
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: work
            mountPath: /work
          - name: scp-infra
            mountPath: /scp
            readOnly: true
        env:
          - name: HOME
            value: /work/home
          - name: SCP_WORK_DIR
            value: /work
          - name: SCP_OUTPUT_DIR
            value: /work/out
          - name: SCP_SOURCE_BASE_URL
            value: {{ include "commanderscp.sourceBaseUrl" $c.buildImage.sourceHost | quote }}
          - name: SCP_STATE_BACKEND_TYPE
            value: {{ $i.stateBackend.type | quote }}
          - name: SCP_BACKEND_CONFIG_FILE
            value: /scp/backend.tfbackend
          {{- if $i.cliConfig }}
          - name: TF_CLI_CONFIG_FILE
            value: /scp/tofurc
          {{- end }}
          - name: TF_IN_AUTOMATION
            value: "1"
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: gitToken
                optional: true
        # Cloud and state-backend credentials, from the operator's Secret FOR THIS PHASE — the plan's
        # read-only, the apply's able to change infrastructure. SCP holds none of them.
        envFrom:
          - secretRef:
              name: {{ $p.credentialsSecret }}
              optional: true
        resources:
          {{- toYaml $i.resources | nindent 10 }}
{{- end }}
{{- range $phase := list "plan" "apply" }}
{{- $p := index $i $phase }}
---
# The {{ $phase }} identity and the one grant Argo's executor cannot run without — the same floor as
# the build identity. Anything else (a `kubernetes` state backend's Secrets, a cloud workload
# identity) is the operator's to add, deliberately outside this chart — read-only for the plan.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $p.serviceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: infra-{{ $phase }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $p.serviceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $p.serviceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $p.serviceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ $p.serviceAccount }}
    namespace: {{ $w.namespace }}
{{- end }}
{{- end }}
{{- end }}
