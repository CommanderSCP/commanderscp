{{- if .Values.bundledExecutor.argoWorkflows.enabled -}}
{{- $w := .Values.bundledExecutor.argoWorkflows -}}
{{- $c := $w.catalog -}}
{{- if not $c.buildImage.builderImage }}{{ fail "bundledExecutor.argoWorkflows.catalog.buildImage.builderImage is empty — the vendored, retargetable buildah image is required (the air-gap install.sh sets it). Fail-closed." }}{{- end -}}
{{- if not $c.buildImage.gitImage }}{{ fail "bundledExecutor.argoWorkflows.catalog.buildImage.gitImage is empty — the vendored, retargetable git image is required. Fail-closed." }}{{- end -}}
# =============================================================================================
# THE SHIPPED BUILD CATALOG (owner decision 2026-09-20: "make it a catalog template SCP ships").
#
# One vetted, PARAMETERISED template every organization gets, rather than a build definition each
# team authors per component. That is only possible because a build-lane trigger now carries its
# source identity and destination (#398): before it, `parameters` came solely from a campaign
# recipe, so a shipped template would have received no repo, no commit and no destination and the
# only workable shape was one hardcoded template per component — a catalog in name only.
#
# VERSIONED IN THE NAME, deliberately. `WorkflowRefSchema` says a workflow is identified by
# repo+branch+path+commitSha and "never a bare template name" (D18), because a bare name cannot
# tell you WHICH definition ran. A shipped template has no tenant-visible repo to pin to, so the
# version moves into the name: `scp-build-image-v1` is a name AND a pin. A change to the build
# steps ships as `-v2` beside it, and existing bindings keep running what they were bound to
# rather than silently acquiring new behaviour.
#
# KNOWN LIMITATION, MEASURED 2026-09-20 — READ THIS BEFORE DEBUGGING A FAILED BUILD.
# On k3s/containerd this template cannot complete a build. `buildah` fails extracting the FIRST
# layer of any base image with:
#
#     While applying layer: ApplyLayer stderr: remount /, flags: 0x44000: permission denied
#
# 0x44000 is MS_PRIVATE|MS_REC — `mount --make-rprivate /`, which containers/storage does before
# chroot-extracting a layer. The container's `/` belongs to the PARENT mount namespace, so its
# propagation cannot be changed from inside, and no amount of privilege short of `privileged: true`
# changes that. Ruled out by direct measurement, so nobody repeats it:
#
#   Ubuntu 24.04 AppArmor userns restriction  NOT IT — `unshare -U` is allowed on the node
#   missing uid mapping                       NOT IT — newuidmap carries cap_setuid=ep
#   running as root instead of uid 1000       NOT IT — fails identically either way
#   adding CAP_SYS_ADMIN                      NOT IT — fails with it added
#   seccomp blocking mount()                  NOT IT — fails under seccompProfile: Unconfined
#
# The options are a userspace-extracting builder (kaniko, which is unmaintained), `privileged:
# true` (which hands a pod running the tenant's own Dockerfile the node's kernel — the exact thing
# the socket invariant below exists to prevent), or NOT building in-cluster at all and coordinating
# the organization's existing CI, which is Mode A and what an org with a pipeline should do anyway.
# That choice is an owner decision and is deliberately NOT made here.
#
# Everything else in this template is verified working: parameters flow, the commit-pinned fetch
# succeeds, registry login succeeds against real credentials, and a missing credential refuses
# before the expensive step.
#
# NO CONTAINER RUNTIME SOCKET, and this is enforced rather than intended: `tools/helm-verify`
# scans the RAW bundled render for the well-known runtime socket paths and fails the build on any
# of them — "a vendored backend mounting a container runtime socket is the same escape, one chart
# along". (That scan is a plain substring match over the rendered text, so even NAMING those paths
# in a comment trips it. This paragraph used to list them and turned the gate red; the list lives
# in RUNTIME_SOCKET_PATTERNS in tools/helm-verify/src/verify.ts, which is the one place it should.)
# So this builds with ROOTLESS BUILDAH over the `vfs` storage driver: no daemon, no socket, no
# /dev/fuse. vfs is slower than overlay and that is the accepted cost of not handing a build pod
# the node container runtime.
# =============================================================================================
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: scp-build-image-v1
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: build-image
    commanderscp.io/catalog-version: v1
spec:
  # A DEDICATED, NEAR-POWERLESS IDENTITY — deliberately NOT `scpAccount`. That account can create
  # and terminate workflows, and this pod runs the tenant's own Dockerfile: mounting a token with
  # that authority would let a malicious build reach the very API SCP coordinates through.
  #
  # Its Role grants `workflowtaskresults: create, patch` and NOTHING else. That is not a choice —
  # it is the floor. `automountServiceAccountToken: false` was tried first and Argo refused the
  # workflow outright ("executor.serviceAccountName must not be empty if
  # automountServiceAccountToken is false"): the emissary executor reports step status back through
  # that resource, so a build pod cannot be tokenless. The vendored bundle ships no role granting
  # it, so this template brings its own, scoped to the one verb pair the executor needs.
  #
  # What a malicious build can therefore do with the token it can read: write its own task results.
  # Not create a workflow, not read a Secret, not reach anything SCP coordinates.
  serviceAccountName: {{ $c.buildServiceAccount }}
  entrypoint: build-and-push
  # WHAT SCP SENDS (apps/server/src/coordination/build-trigger-parameters.ts). Every one of these
  # is something SCP already held and passed on; none is resolved by this template.
  #
  # The three with no default are REQUIRED: Argo refuses to submit without them. That is the point
  # — #398 omits an absent key rather than sending it empty, so a missing `sourceCommit` refuses
  # the run instead of building whatever HEAD happens to be. A refused run beats a wrong artifact.
  arguments:
    parameters:
      - name: sourceRepo
      - name: sourceCommit
      - name: imageRepository
      - name: registryUrl
        value: https://ghcr.io
      # WHERE THIS COMPONENT'S DOCKERFILE IS, relative to the repo root. A monorepo puts each
      # component's under its own directory (`apps/profile-web/Dockerfile`), so this is a fact
      # about the COMPONENT and arrives as a parameter — SCP reads it off the component's own
      # `properties.dockerfile`. The default below is the single-service repo case; carrying it
      # only in chart values would force every component in an organization to share one path.
      - name: dockerfile
        value: {{ $c.buildImage.dockerfile }}
      - name: sourceRef
        value: ""
      - name: registryName
        value: ""
      - name: changeObjectId
        value: ""
  templates:
    # ONE POD, NOT TWO STEPS. An earlier revision made fetch and build separate steps passing the
    # checkout as an Argo ARTIFACT — which Argo rejected outright ("inputs.artifacts.source was not
    # supplied") and which would have been wrong even once wired: artifact passing between steps
    # requires a configured artifact repository (S3/MinIO/…), and a template every organization
    # gets must not assume one exists. An init container sharing an `emptyDir` with the builder
    # needs no repository, no PVC and no dynamic provisioning.
    - name: build-and-push
      inputs:
        parameters:
          - name: sourceRepo
          - name: sourceCommit
          - name: imageRepository
          - name: registryUrl
          - name: dockerfile
          - name: sourceRef
          - name: registryName
          - name: changeObjectId
      volumes:
        - name: workspace
          emptyDir: {}
      # ---- 1. SOURCE, PINNED TO THE COMMIT ---------------------------------------------------
      # Fetched by COMMIT, never by branch: the artifact SCP will scan and sign has to correspond
      # to a known revision, and `sourceRef` is carried for provenance rather than for checkout.
      # A branch name would let the tree move between the trigger and the fetch.
      initContainers:
        - name: fetch-source
          image: {{ $c.buildImage.gitImage }}
          mirrorVolumeMounts: true
          command: [sh, -eu, -c]
          args:
            - |
              set -eu
              repo="$0"; commit="$1"
              : "${GIT_TOKEN:=}"
              host="{{ $c.buildImage.sourceHost }}"
              if [ -n "$GIT_TOKEN" ]; then
                remote="https://x-access-token:${GIT_TOKEN}@${host}/${repo}.git"
              else
                remote="https://${host}/${repo}.git"
              fi
              mkdir -p /work/src && cd /work/src
              git init -q .
              git remote add origin "$remote"
              git fetch -q --depth 1 origin "$commit"
              git checkout -q FETCH_HEAD
              # Prove what was fetched, so the log records the revision rather than the request.
              echo "fetched $(git rev-parse HEAD) from ${repo}"
            - "{{`{{inputs.parameters.sourceRepo}}`}}"
            - "{{`{{inputs.parameters.sourceCommit}}`}}"
          env:
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $c.credentialsSecret }}
                  key: gitToken
                  optional: true
          resources:
            {{- toYaml $c.buildImage.resources.fetch | nindent 12 }}
      # ---- 2. BUILD + PUSH, ROOTLESS ---------------------------------------------------------
      container:
        image: {{ $c.buildImage.builderImage }}
        # ROOTLESS MEANS NON-ROOT, which is not the same as "no privileged flag". Running buildah
        # as root WITHOUT capabilities is the worst of both worlds and is what this template did
        # first: layer extraction died with `remount /, flags: 0x44000: permission denied`, because
        # applying a layer needs privileges that uid 0 in a container does not actually hold.
        #
        # As uid 1000 buildah UNSHARES A USER NAMESPACE and holds those privileges INSIDE it,
        # using the subuid/subgid ranges the image ships for this user (`build:1001:64535`). No
        # added capabilities, no privileged, no socket — the node's container runtime is never
        # reachable from here, which is the invariant the whole design rests on.
        securityContext:
          runAsUser: {{ $c.buildImage.runAsUser }}
          runAsGroup: {{ $c.buildImage.runAsUser }}
          allowPrivilegeEscalation: false
        volumeMounts:
          - name: workspace
            mountPath: /work
        command: [sh, -eu, -c]
        args:
          - |
            set -eu
            repository="$0"; registryUrl="$1"; commit="$2"; dockerfile="$3"
            # The registry HOST, from the URL SCP passed. Derived here rather than configured, so
            # a component publishing somewhere other than the default still works.
            host="${registryUrl#https://}"; host="${host#http://}"; host="${host%%/*}"
            tag="${host}/${repository}:${commit}"
            cd /work/src
            [ -f "$dockerfile" ] || {
              echo "no $dockerfile in ${repository} at ${commit}. This catalog template builds a" >&2
              echo "Dockerfile-based image; set the component's properties.dockerfile if it lives" >&2
              echo "somewhere other than the repository root (a monorepo usually does), or use a" >&2
              echo "template of your own if it does not build from a Dockerfile at all." >&2
              exit 2
            }
            if [ -n "${REGISTRY_USERNAME:-}" ] && [ -n "${REGISTRY_PASSWORD:-}" ]; then
              buildah login --username "$REGISTRY_USERNAME" --password "$REGISTRY_PASSWORD" "$host"
            else
              echo "no registry credentials in secret {{ $c.credentialsSecret }} — refusing to build" >&2
              echo "an image that cannot be pushed, rather than failing after the expensive step" >&2
              exit 2
            fi
            # vfs + chroot: no daemon, no socket, no /dev/fuse. See the header.
            # CONTEXT IS THE REPO ROOT, dockerfile path relative to it — which is what a monorepo
            # needs: apps/profile-web/Dockerfile routinely COPYs from packages/ and the workspace
            # lockfile at the root, so a context narrowed to the component's directory would fail
            # to resolve them.
            buildah --storage-driver vfs bud --isolation chroot \
              -f "$dockerfile" -t "$tag" .
            buildah --storage-driver vfs push "$tag"
            echo "pushed $tag"
          - "{{`{{inputs.parameters.imageRepository}}`}}"
          - "{{`{{inputs.parameters.registryUrl}}`}}"
          - "{{`{{inputs.parameters.sourceCommit}}`}}"
          - "{{`{{inputs.parameters.dockerfile}}`}}"
        env:
          - name: REGISTRY_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryUsername
                optional: true
          - name: REGISTRY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ $c.credentialsSecret }}
                key: registryPassword
                optional: true
        resources:
          {{- toYaml $c.buildImage.resources.build | nindent 10 }}
---
# The near-powerless identity above, and the one grant Argo's executor cannot run without.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.buildServiceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
    commanderscp.io/catalog: build-image
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $c.buildServiceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
rules:
  # THE EXECUTOR'S FLOOR, and the whole of it. `create` + `patch` on workflowtaskresults is how the
  # emissary executor reports a step's outcome. Anything more would be authority a tenant's own
  # Dockerfile could reach.
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $c.buildServiceAccount }}
  namespace: {{ $w.namespace }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: bundled-argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $c.buildServiceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ $c.buildServiceAccount }}
    namespace: {{ $w.namespace }}
{{- end }}
