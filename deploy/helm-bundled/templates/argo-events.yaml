{{- if .Values.bundledExecutor.argoEvents.enabled -}}
{{- $e := .Values.bundledExecutor.argoEvents -}}
{{- if not $e.image }}{{ fail "bundledExecutor.argoEvents.enabled=true but .image is empty — the vendored, retargeted argo-events image is required (set by the air-gap install.sh). Fail-closed." }}{{- end -}}
{{- if not $e.vendoredImage }}{{ fail "bundledExecutor.argoEvents.vendoredImage is empty — this is the retarget SOURCE (the upstream ref the vendored file currently declares). Fail-closed rather than silently skip the retarget." }}{{- end -}}
# =============================================================================================
# Bundled Argo Events (Mode B). Vendored, UNMODIFIED upstream v1.9.10
# (deploy/helm/vendor/argo-events/install.yaml, sha256-pinned) rendered into {{ $e.namespace }} via
# commanderscp.renderVendoredBackend, with only the controller image retargeted. Event sources/
# sensors defined here can POST to SCP's change-source webhook — feeding the observe() path (M10.2)
# for domains that can't be webhooked directly by their upstream systems.
#
# NAMESPACE-SCOPED (#421 review). Upstream binds `argo-events-sa` cluster-wide to a role that
# creates pods, deployments and secrets — in EVERY namespace, the stack controller's included. SCP's
# event sources and sensors live here, so the controller runs `--namespaced` on this namespace and
# its role is bound by a RoleBinding here only (bindInNamespace). What that gives up: EventSources /
# Sensors in other namespaces are not reconciled by the bundled controller (none ship).
# =============================================================================================
{{- include "commanderscp.renderVendoredBackend" (dict
    "ctx" .
    "namespace" $e.namespace
    "component" "bundled-argo-events"
    "manifest" (.Files.Get "vendor/argo-events/install.yaml")
    "replaces" (list
      (list $e.vendoredImage $e.image)
    )
    "resources" $e.resources
    "bindInNamespace" (list "argo-events-binding")
    "containerArgs" (dict "controller-manager" (list "--namespaced" (printf "--managed-namespace=%s" $e.namespace)))
  ) }}
{{- end }}
