# =============================================================================================
# CommanderSCP Standard Stack — bundled executor backends (Mode B, ADR-0002).
#
# This chart is delivered via `helm template … | kubectl apply --server-side` (see
# scripts/scp-bundled.sh + deploy/airgap/assets/install.sh), NOT `helm install` — the vendored
# manifests exceed Helm's 1 MB release-Secret limit. Each backend is off by default; enable exactly
# the one you are applying. `--server-side` is REQUIRED: the vendored CRDs are large enough that
# client-side apply's last-applied-configuration annotation would overflow the per-object limit.
# =============================================================================================

# Federation role of the outpost this bundle is being applied to (commander | outpost | retrans).
# METADATA ONLY — it drives a CHART-RENDER-TIME self-consistency LINT (M15.4), not any SCP runtime
# authority. The operator sets BOTH this role AND the bundledExecutor.*.enabled flags below at
# install time, so pairing an install-time role with the install-time enablement lets tooling
# (tools/helm-verify) catch a MISCONFIGURATION: a role enabling a bundled backend it should not run
# (e.g. a `retrans` CDS-boundary relay — a validate-and-forward node, not an execution site —
# enabling any executor at all). This is deliberately NOT runtime enforcement: the runtime
# `self_domain.role` (commander|outpost|retrans, set post-install via the federation API) is
# ADVISORY metadata with no bearing on a Helm install-time value and no graph representation of
# bundled-backend enablement, so runtime enforcement here would be a fork (owner decision, M15.4).
# The allowed-backends-per-role matrix lives in tools/helm-verify/src/verify.ts; invalid values are
# rejected at render (see commanderscp.federationRole in templates/_helpers.tpl).
federationRole: commander

bundledExecutor:
  # The namespace the MAIN CommanderSCP chart is installed into. Used to scope the bundled
  # backends' ingress NetworkPolicies to SCP's own pods rather than to any pod anywhere that
  # happens to carry SCP's label. `scp-bundled.sh` passes this from its --scp-namespace flag.
  #
  # Empty is REFUSED where it is load-bearing (see argo-workflows-networkpolicy.yaml). An
  # unscoped selector is `namespaceSelector: {}` ANDed with a pod label, and a pod label is
  # writable by anyone who can create a pod in any namespace — so leaving it empty turns a network
  # control into one its own subject can satisfy. Measured: adding
  # `app.kubernetes.io/name=commanderscp` to a busybox pod in `default` was enough to reach
  # argo-server:2746 through the policy.
  scpNamespace: ""
  argocd:
    enabled: false
    # Own namespace so the bundled backend keeps its own RBAC + cluster credentials, isolated from
    # scpd (which never gets those — SCP only ever holds the scoped Argo CD API token). Must match
    # the slim bundledExecutor.argocd.namespace in the MAIN chart's values (the auto-wire hook +
    # NetworkPolicy there target this namespace).
    namespace: scp-argocd
    # VENDORED, RETARGETABLE image refs. Defaults are the upstream refs so a CONNECTED enable works
    # out of the box (`scp-bundled.sh enable argocd`, zero flags); the air-gap install.sh rewrites
    # them to the customer registry at a pinned digest.
    image: quay.io/argoproj/argocd:v3.4.5 # Argo CD (Apache-2.0)
    valkeyImage: valkey/valkey:8-alpine # Valkey (BSD-3) — Argo CD's cache; an OWNED, TESTED deviation from upstream's Redis
    # The scoped, non-admin account SCP mints in the bundled Argo CD and coordinates through. The
    # auto-wire hook (in the MAIN chart) mints its token and stores it as an SCP secret.
    scpAccount: scp-coordinator
    # Per-CONTAINER resource requests/limits. Modest defaults sized for a coordination-tier install.
    #
    # KEYED BY CONTAINER NAME, and RE-KEYED 2026-09-20 from the component names this block used to
    # carry (`server`/`repoServer`/`applicationController`/`valkey`). The numbers are unchanged; the
    # old keys were read by NOTHING — no template referenced this block, so every bundled Argo CD
    # workload rendered with no requests and no limits while these values sat here looking applied.
    # A knob that reads as configuration and is wired nowhere is worse than an absent one, because
    # setting it produces no effect AND no error.
    resources:
      argocd-server:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 256Mi }
      argocd-repo-server:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 256Mi }
      argocd-application-controller:
        requests: { cpu: 250m, memory: 256Mi }
        limits: { cpu: "1", memory: 512Mi }
      argocd-applicationset-controller:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 250m, memory: 128Mi }
      argocd-notifications-controller:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 250m, memory: 128Mi }
      dex:
        requests: { cpu: 25m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
      # The container is `redis`; the IMAGE is Valkey (an owned, tested deviation from upstream).
      redis:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
      # INIT containers. They run to completion rather than steady-state, but an unbounded one can
      # still spike a single-node install at exactly the moment everything else is starting.
      # Gitea's three init containers are NOT listed anywhere: upstream already sizes them, and an
      # entry here would silently override that.
      copyutil:
        requests: { cpu: 25m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
      secret-init:
        requests: { cpu: 25m, memory: 32Mi }
        limits: { cpu: 200m, memory: 128Mi }
  # Argo Workflows (Mode B — bundled CI / build / test). Vendored, unmodified upstream v4.0.7;
  # off by default; two retargetable images (fail-closed when empty). Coordinated via the generic
  # pipeline executor (M10.6) — the bundle DEPLOYS it; SCP never runs CI itself.
  argoWorkflows:
    enabled: false
    namespace: scp-argo-workflows
    # Upstream defaults (connected enable works out of the box); air-gap install.sh retargets.
    serverImage: quay.io/argoproj/argocli:v4.0.7 # argo-server / UI
    controllerImage: quay.io/argoproj/workflow-controller:v4.0.7 # workflow-controller
    # The Secret holding argo-server's TLS certificate, created by `scp-bundled.sh enable` if it
    # does not exist and NEVER regenerated afterwards.
    #
    # Without it argo-server mints a fresh self-signed certificate ON EVERY START — measured across
    # three restarts, three distinct fingerprints, each `valid_from` matching pod start. That makes
    # the CA unpinnable: SCP's `executorTls` trust would work until the first restart of this pod
    # and then fail verification with an error that looks like SCP's own misconfiguration. Plain
    # HTTP was considered instead and rejected: argo-server runs `--auth-mode=client` (measured: an
    # unauthenticated call returns 401), so every request carries a Kubernetes bearer token, and on
    # a multi-node cluster with an unencrypted CNI that token crosses the wire in clear.
    tlsSecretName: argo-server-tls
    # The scoped, non-admin ServiceAccount SCP authenticates as when coordinating this backend —
    # the same shape as `bundledExecutor.argocd.scpAccount` and `gitea.scpAccount`, which this
    # backend was missing entirely.
    #
    # It is load-bearing rather than cosmetic: argo-server runs `--auth-mode=client`, so every call
    # SCP makes carries THIS account's token and every Kubernetes action is performed AS it. The
    # Role bound to it is therefore the exact set `@scp/plugin-argo-workflows` calls and nothing
    # more — see the template for the endpoint-by-endpoint derivation.
    scpAccount: scp-coordinator
    # THE SHIPPED CATALOG (owner decision 2026-09-20). Vetted, parameterised templates every
    # organization gets, rather than a build definition authored per component. Only possible
    # because a build trigger now carries its source identity and destination (#398).
    catalog:
      # The Secret the catalog reads credentials from, in this backend's namespace. Every key is
      # OPTIONAL at mount so the template can refuse with a sentence rather than crashloop on a
      # missing Secret — but the build step exits non-zero without registry credentials,
      # deliberately BEFORE the expensive step rather than after it.
      #   gitToken          — read access to the source repo (omit for a public repo)
      #   registryUsername  — registry push identity
      #   registryPassword  — registry push token (for GHCR: a PAT with `packages:write`)
      # NOT created by this chart: minting a forge credential is an operator act, and a chart that
      # generated one would either be wrong or would need the forge's own credentials to do it.
      credentialsSecret: scp-build-registry
      # The identity catalog BUILD PODS run as — bound to no Role, token not mounted. Separate from
      # `scpAccount` on purpose: that one can create and terminate workflows, and a build pod runs
      # the tenant's own Dockerfile.
      buildServiceAccount: scp-build
      buildImage:
        # VENDORED, RETARGETABLE images, same rule as the backends themselves: upstream refs so a
        # CONNECTED install works out of the box; the air-gap install.sh rewrites them onto the
        # bundle registry (deploy/airgap/src/bundle-images.ts carries both, so `scp-airgap bundle`
        # mirrors them — without that an air-gapped build pod would pull from the internet, which
        # is the one thing the bundle exists to prevent).
        builderImage: moby/buildkit:v0.33.0-rootless # BuildKit, rootless (Apache-2.0)
        gitImage: alpine/git:2.47.2 # git (MIT)
        # The forge the source repo lives on. `sourceRepo` arrives as `owner/name`, so the host is
        # configuration rather than something to parse out of it.
        sourceHost: github.com
        # The NON-ROOT uid the builder runs as, and the fsGroup its emptyDirs are created under.
        # `moby/buildkit:*-rootless` ships user `user` (1000) with the subuid/subgid ranges
        # rootlesskit needs; running as root instead fails buildkitd startup outright. It also
        # names the $XDG_RUNTIME_DIR mount path (/run/user/<uid>), which the image compiles in —
        # so retargeting this to a builder image whose rootless user differs means checking both.
        runAsUser: 1000
        # Path to the Dockerfile WITHIN the source repo. A component that builds another way needs
        # its own template — this one is deliberately the common case, not every case.
        dockerfile: Dockerfile
        resources:
          fetch:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # Sized for a real image build. Everything buildkit writes — the layer store, the
          # checkout, the temp dirs — lives on emptyDirs, so the node's ephemeral storage is the
          # real ceiling here rather than these limits.
          build:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
      # scp-build-rpm-v1 (M28.1, ADR-0053). Shares buildImage.gitImage/sourceHost/resources.fetch
      # for its source checkout and `credentialsSecret` for its publish — one catalog, one
      # checkout, one push identity (a unified Gitea serves OCI and RPM from the same account).
      buildRpm:
        # scp-builder-rpm (apps/builder-rpm) — FIRST-PARTY, so there is no upstream ref to default
        # to, and the template is NOT RENDERED until this is set. The air-gap install.sh sets it
        # from the bundle; a connected install sets it to the published ghcr.io/commanderscp ref.
        builderImage: ""
        resources:
          build:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
    # Per-CONTAINER resources. Upstream ships neither workload with any, which makes both
    # BestEffort — unbounded, and first evicted under node pressure.
    resources:
      workflow-controller:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
      argo-server:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 250m, memory: 256Mi }
  # Bundled Argo Rollouts (Mode B). Vendored, unmodified upstream v1.10.0; off by default; one
  # retargetable image.
  #
  # THE ONE BUNDLE THAT IS NOT AN EXECUTOR. Every other backend here is a system SCP coordinates —
  # it has a plugin, a binding and a verb set. Argo Rollouts has none, by decision: ADR-0008 §3
  # reads progressive-delivery state off the Argo CD Application resource tree ("no new credential,
  # no new executor") and pins that rollout state is "OBSERVED (mirrored), never DRIVEN". Enabling
  # this installs the controller so that state EXISTS; SCP then reads it through the Argo CD plugin
  # it already has, and never speaks to this. There is nothing to bind and nothing to import.
  #
  # OPTIONAL, AND NARROWER THAN WAVES. This is the WITHIN-a-target canary (what fraction of one
  # deployment's pods run the new version) and it is Kubernetes-only. SCP's own progressive
  # rollout — ACROSS targets, with soak gates between them — is `waves.widening`/`linear`/`byDomain`
  # plus the `bakeAlarms` quiet window, and that is executor-agnostic: it orders static instances,
  # VMs or anything else with no container runtime in sight. An org not running Kubernetes leaves
  # this off and loses none of that.
  argoRollouts:
    enabled: false
    namespace: scp-argo-rollouts
    image: quay.io/argoproj/argo-rollouts:v1.10.0 # Argo Rollouts (Apache-2.0)
    resources:
      # Upstream ships ONLY an ephemeral-storage limit on this container and no cpu/memory at all,
      # which leaves it BestEffort and first to be evicted. The injection REPLACES the whole
      # resources block by container name, so upstream's ephemeral-storage limit is repeated here
      # deliberately — omitting it would silently drop a bound upstream chose to set.
      argo-rollouts:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi }
  # Argo Events (Mode B — event sources/sensors that can feed SCP's observe() path). Vendored,
  # unmodified upstream v1.9.10; off by default; one retargetable image.
  argoEvents:
    enabled: false
    namespace: scp-argo-events
    image: quay.io/argoproj/argo-events:v1.9.10 # argo-events controller — retargeted by install.sh
    # Per-CONTAINER resources; upstream ships none.
    resources:
      controller-manager:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 250m, memory: 256Mi }
  # Gitea (Mode B — the DEFAULT bundled unified registry: image + code + package, ADR-0012).
  # Vendored, unmodified upstream chart v12.6.0 (app 1.26.1) in the SQLite / single-replica /
  # no-external-DB / no-valkey minimal profile — Gitea runs self-contained on SQLite + one PVC.
  # Off by default; one retargetable image (fail-closed when empty). Its Secrets (admin creds +
  # SECRET_KEY/INTERNAL_TOKEN + config/init machinery) are SCP-generated in gitea-secrets.yaml,
  # never baked into the vendored manifest. Harbor is REMOVED from the default stack — an existing
  # Harbor is served via the IMPORT path (coordinated as an execution system), not bundled.
  gitea:
    enabled: false
    namespace: scp-gitea
    # VENDORED, RETARGETABLE image. Default is the upstream ref so a CONNECTED enable works out of
    # the box (`scp-bundled.sh enable gitea`, zero flags); the air-gap install.sh rewrites it to the
    # customer registry at a pinned digest. In chart v12.6.0 the running workload is a SINGLE image
    # (the only upstream busybox ref was the helm-test Pod, which is stripped).
    image: docker.gitea.com/gitea:1.26.1-rootless # Gitea (MIT)
    # Operator override for the bundled admin password; empty ⇒ SCP generates a random one per
    # install (persisted across upgrade via lookup). SCP only ever holds the SCOPED token derived
    # from this account at runtime, never the password.
    adminPassword: ""
    # The Gitea admin account SCP creates + coordinates through. The auto-wire hook basic-auths as
    # this account and mints a SCOPED (least-privilege, non-admin) API token, stored as an SCP secret.
    scpAccount: scp-gitea-admin
    # Per-CONTAINER resources; upstream ships none. Sized above the others: Gitea is the bundled
    # registry as well as the git server, so it serves blob pushes and pulls.
    resources:
      gitea:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { cpu: "1", memory: 768Mi }
