{{/*
EVALUATION-ONLY in-cluster PostgreSQL — a plain `postgres:16` Deployment + PVC + Service. NO
Bitnami/third-party subchart (DESIGN §16: licensing/registry churn; no bundled operator). Not for
production: no HA, no backups, no tuning. `postgres.evalInCluster.enabled: true` is the on-ramp
for `kind`/local evaluation clusters that don't already have an external Postgres.

HOOK ORDERING AND DELETE POLICY (see secrets-generated.yaml's doc comment for the full story —
both were real bugs caught against a live kind cluster while building this chart): the migrations
Job is a pre-install hook, which runs strictly BEFORE any of this chart's normal (non-hook) release
resources exist — including this eval Postgres. For `postgres.evalInCluster.enabled: true` to
work in a single `helm install`, THIS must also be a pre-install,pre-upgrade hook, at a LOWER
weight ("-20") than the generated secrets ("-10") and the migrations Job ("0") — Postgres starts
first, then its credentials Secret, then migrations run against it. The migrations Job's own
`wait-for-postgres` init container is the belt-and-braces backstop for "created" vs. "actually
accepting connections yet". `"helm.sh/hook-delete-policy": hook-failed` (explicit, overriding
Helm's own default of `before-hook-creation`) is what stops `helm upgrade` from deleting and
recreating this PVC — and therefore the whole eval database — on every single upgrade.

#422 re-verify, item 5 — `hook-failed` alone is not enough: measured against a real kind cluster,
a SECOND `helm upgrade` (this milestone's own idempotent re-run) failed outright —
`persistentvolumeclaims "…-postgres-eval" already exists`. Helm's hook execution does a raw
`Create()` for every hook resource on EVERY firing, checked against existing ONLY when
`hook-delete-policy` includes `before-hook-creation` (which this deliberately does NOT, per the
paragraph above — that would delete-and-recreate the whole database). Without that check, a
SECOND `Create()` against an object that already exists is a plain Kubernetes 409, for any kind —
the PVC hit it first (declared first, so it runs first and the whole hook batch aborts there), but
the Deployment and Service below would hit the identical error next. Fixed with the SAME
`lookup`-and-preserve idiom this chart already uses for its generated Secrets (secrets-generated.yaml,
stackd.yaml): each of the three resources below checks whether it ALREADY EXISTS and renders
NOTHING at all when it does — Helm's hook machinery never attempts to re-`Create()` something
already there. The trade-off, acceptable for something this doc's own header already calls
EVALUATION-ONLY with "no tuning": once created, a `helm upgrade` never applies a LATER change to
these three objects' spec (image tag, resources, …) — an eval operator who wants that deletes the
object by hand first (`kubectl delete deploy/svc/pvc …-postgres-eval`) and re-runs `helm upgrade`.
Under GitOps (`helm template`, no live cluster), `lookup` already returns nothing for everything —
unchanged from today, and this feature is eval/kind-only regardless.
*/}}
{{- if .Values.postgres.evalInCluster.enabled }}
{{- if not .Values.postgres.evalInCluster.existingClaim }}
{{- $pvcName := printf "%s-postgres-eval" (include "commanderscp.fullname" .) }}
{{- if not (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $pvcName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-eval
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-failed
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.evalInCluster.storageClassName }}
  storageClassName: {{ .Values.postgres.evalInCluster.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.evalInCluster.storage }}
---
{{- end }}
{{- end }}
{{- $deployName := printf "%s-postgres-eval" (include "commanderscp.fullname" .) }}
{{- if not (lookup "apps/v1" "Deployment" .Release.Namespace $deployName) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $deployName }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-eval
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-failed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "commanderscp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-eval
  template:
    metadata:
      labels:
        {{- include "commanderscp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-eval
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "postgres:16"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # postgres itself needs to write its data dir — read-only rootfs stays on for every
            # OTHER path via an explicit writable emptyDir for /tmp and PGDATA lives on the PVC.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.adminUser | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "commanderscp.postgresSecretName" . }}
                  key: adminPassword
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.adminUser | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.adminUser | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          # 2026-09-17 eviction incident (see postgres.evalInCluster.resources' doc comment in
          # values.yaml): this container previously declared NO resources at all, which is
          # BestEffort QoS — Kubernetes evicts BestEffort pods FIRST under node memory pressure,
          # ahead of every other pod this chart renders. A memory request alone (no default limit)
          # moves it to Burstable without risking an OOMKill from a guessed limit.
          resources:
            {{- toYaml .Values.postgres.evalInCluster.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgres.evalInCluster.existingClaim | default (printf "%s-postgres-eval" (include "commanderscp.fullname" .)) }}
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
---
{{- end }}
{{- $svcName := printf "%s-postgres-eval" (include "commanderscp.fullname" .) }}
{{- if not (lookup "v1" "Service" .Release.Namespace $svcName) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-eval
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-failed
spec:
  selector:
    {{- include "commanderscp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-eval
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
{{- end }}
{{- end }}
