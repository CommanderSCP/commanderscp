{{/*
THE RUNNER RBAC — one Role, one RoleBinding, for ALL THREE MANAGED CLASSES, plus the M8 reference
Job ConfigMap that only managed-IaC ever had.

WHAT M23.4 CHANGED HERE, AND WHY EACH ONE WAS A DEFECT RATHER THAN A PREFERENCE:

1. THE ROLE WAS GATED ON `managedIac.enabled` AND IS NOW GATED ON "a managed run can happen here".
   Measured, not inferred: `helm template --set managedRunners.launcher=kubernetes --set
   managedDep.runnerImage=... ` (managed-IaC off) rendered the worker's service-account token, the
   kube-API egress allow, the workspace mount and every launcher setting — and NO Role and NO
   RoleBinding at all. The worker authenticates and every `jobs: create` is a 403. managed-dep, the
   one class that WRITES to a user's repository, was dead on Kubernetes in that configuration, and
   `helm-verify`'s own M23.2 case (a) proves the TOKEN arrives for a dep-only render while nothing
   checked that the RBAC did. That is the incomplete-call-site-census property CLAUDE.md names: the
   launcher's wiring was fixed for all three classes and its AUTHORISATION was fixed for one.

2. IT RENDERS INTO THE RUNNER NAMESPACE, not unconditionally into `.Release.Namespace`.
   `managedRunners.kubernetes.namespace` has been operator-settable since M23.2 and the adapter
   creates its Jobs there; the Role went to the release namespace regardless. Setting the value the
   chart itself recommends produced a silent 403 on every launch. Both now come from
   `commanderscp.runnerNamespace`. The RoleBinding's SUBJECT stays in the release namespace, because
   that is where the ServiceAccount lives — a RoleBinding may name a subject from another namespace,
   and this is the case it exists for.

3. IT IS NO LONGER RENDERED FOR A `docker` DEPLOYMENT. A Role granting Job creation to a
   ServiceAccount whose pods mount no token (the chart sets `automountServiceAccountToken: false`
   for the docker launcher, and `helm-verify` asserts it) is a standing grant for a caller that
   never calls. Strictly a narrowing, and declared as one in `tools/helm-verify`.

WHAT IS MACHINE-CHECKED ABOUT THIS FILE (M23.6, and this paragraph REPLACES the "HONEST SCOPE" note
that stood here from M8 until 2026-08-21). That note said managed execution "does NOT yet work
unmodified inside a standard Kubernetes pod", and it was already out of date in the other direction:
`packages/runner-launcher`'s Kubernetes adapter launches each run as a Job through the API server and
`kubernetes-adapter.kind.test.ts` proves it against a real cluster. The note's own instruction was
that it stays exactly as written until every M23.6 clause is machine-checked. All seven now are, and
these are the gates rather than a summary of them:

  THE RULES BELOW ARE DIFFED AGAINST WHAT THE ADAPTER CALLS, IN BOTH DIRECTIONS. `kubernetesRunnerRbac()`
  is the declaration; `kubernetes-rbac-contract.test.ts` holds it to the code by DRIVING every route
  the adapter has over a recording io and deriving the verbs from the wire; `tools/helm-verify`
  asserts these rules equal it as a SET, so an UNUSED verb is a red build exactly as a missing one
  is. The kind suite asks a real authorizer the same question, including the "no"s.

  NO POD MOUNTS A CONTAINER RUNTIME SOCKET, IN ANY VALUE COMBINATION. `helm-verify` renders 156
  combinations — every `managed*` enablement combination x both launchers x runner namespace x
  perRunSecrets x acceptSharedNamespaceSecretDelete x runAsNonRoot, twice, plus an api.role sweep —
  and checks each render structurally and as raw bytes. It also derives the RUNNER JOB manifest from
  each render's own environment, because `helm template` cannot see that pod at all, and checks it
  too. A source census over every template asserts the strings appear nowhere, which covers the
  combinations no sweep can enumerate.

  NOTHING SPAWNS A CONTAINER CLI ON THIS PATH, AND NOTHING KUBERNETES IS BUILT ON THE OTHER ONE.
  `spawnRunnerProcess` is the package's only spawn and records the binary by name; each of the three
  managed plugins asserts an empty ledger on the Kubernetes path and a non-empty one on the Docker
  path. A construction counter makes "no Kubernetes client is instantiated on a compose install" an
  assertion rather than an inference.

WHAT IS STILL NOT COVERED, KEPT HERE RATHER THAN RETIRED WITH THE NOTE:

  `--network none` IS NOT EXPRESSIBLE ON A POD. No pod-spec field removes a pod's network namespace.
  Runner pods carry `scp.launcher.network=<requested mode>` and the chart renders a default-deny
  NetworkPolicy for `none`, which is TRAFFIC DENIAL, NOT INTERFACE ABSENCE — and fail-open on a CNI
  that does not enforce NetworkPolicy at all. Owner decision 2026-08-18; do not read the label as
  containment.

  THE `secrets: delete` GRANT IS NAMESPACE-WIDE and `resourceNames` cannot narrow it (see the block
  on the rule itself). The available narrowing is deployment-shaped — a runner namespace — and it is
  enforced at render time rather than recommended.

  THE START VERDICT CAN ASSERT MORE THAN IT WATCHED, for up to `2 * pollIntervalMs +
  RUNNER_MIN_STEP_BUDGET_MS` (4,010ms at the default cadence): a container that starts inside that
  window is not in the last landed read, and arm 7 says `NOTHING RAN`. Closing it needs a fourth
  post-deadline call, which moves the reap stamp and every outer grace. A second residual beside it:
  arm 7 does not ask WHAT the last read said, so a pod the cluster reported as conclusively blocked
  and which is then unblocked inside the same window is still recorded as never having started. Both
  are stated in full at `kubernetesStartVerdict` in `packages/runner-launcher/src/kubernetes-adapter.ts`.

  THE DOCKER PATH IS STILL WHAT A DOCKER-COMPOSE OR VM DEPLOYMENT TAKES; which one runs is
  `managedRunners.launcher`. The ConfigMap at the bottom is the M8 REFERENCE SHAPE and is no longer
  what launches — `jobManifest()` is, pinned whole by `kubernetes-launch.golden.test.ts`.
*/}}
{{- if eq (include "commanderscp.needsRunnerApiAccess" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "commanderscp.fullname" . }}-runner-iac
  # THE RUNNER NAMESPACE, not unconditionally the release namespace — see point 2 in the module doc.
  namespace: {{ include "commanderscp.runnerNamespace" . }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
rules:
  # `patch` WAS MISSING AND THE PATH WAS DEAD WITHOUT IT (M23.2). This Role shipped as
  # create/get/list/watch/delete, which is every verb a launcher that only creates and deletes Jobs
  # needs — and the M23.2 adapter creates its Job SUSPENDED (so the name is staked before a single
  # byte is copied into the shared workspace, which is what keeps two concurrent runs of one runId
  # from corrupting each other) and then PATCHes `spec.suspend: false` to start it. Against the
  # Role as shipped that PATCH is a 403 and every managed run on Kubernetes fails at `start`.
  #
  # FOUND BY THE HARNESS, NOT BY READING. `scripts/kind-runner-harness.sh` binds a token to THIS
  # Role — rendered by `helm template`, never a hand-written copy — and
  # `kubernetes-adapter.kind.test.ts` asks `kubectl auth can-i` for each verb by name, so a verb the
  # adapter needs and this file does not grant fails with the verb in the message. That is the whole
  # reason owner decision 3 required a real cluster: a fake authorises everything.
  #
  # NARROWED TO EXACTLY WHAT THE ADAPTER ISSUES (M23.6 clause 5), AND THE VERBS REMOVED WERE
  # MEASURED AS UNUSED RATHER THAN JUDGED SO. `packages/runner-launcher`'s
  # `kubernetes-rbac-contract.test.ts` DRIVES the adapter across every route it has over a recording
  # io, maps each `(method, path)` that reached the wire onto the verb the authorizer requires, and
  # asserts the result equals `kubernetesRunnerRbac()`. `tools/helm-verify` then asserts THESE RULES
  # equal the same declaration, as a SET, in BOTH DIRECTIONS — an unused verb here fails the build
  # exactly as a missing one does. Before that gate existed, four unused verbs added to this file
  # (`jobs: +deletecollection,+update`; `pods,pods/log: +delete,+create`) left helm-verify green, the
  # whole workspace green and the kind suite green.
  #
  #   `watch` on jobs and on pods/pods-log — REMOVED. Inherited from M8's reference shape.
  #     `KUBERNETES_POLL_INTERVAL_MS`'s own doc says "A POLL AND NOT A WATCH, deliberately" (a watch
  #     stream that ends silently is indistinguishable from "nothing has happened yet"), and there is
  #     no `watch=` query anywhere in the adapter. Removing both left the kind suite green.
  #   `pods` and `pods/log` — SPLIT. They are two distinct RBAC resources and one shared verb list
  #     grants each the other's: `get` on `pods` and `list` on `pods/log`, neither ever issued. The
  #     pod is only ever found by label selector over the collection; the log is only ever a
  #     subresource GET on one pod.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # THE JOB'S OWN EVENTS (M23.5) — `list` only, and it is the ONLY place one failure route is ever
  # written down.
  #
  # WHY IT IS NEEDED. When a Job cannot create a pod — a ResourceQuota requiring compute limits, a
  # PodSecurity admission refusal — there is no pod to carry a status and the Job's `status` says
  # nothing either. The controller writes `Warning FailedCreate: ... must specify limits.memory for:
  # runner` as an Event on the Job, and that is the whole diagnosis. Without this rule the adapter
  # polled to the whole-run deadline and reported `budget-exhausted`, i.e. "a `tofu apply` was
  # SIGTERMed mid-flight, so the real infrastructure state is unknown" — when nothing had run at all.
  # Teardown then deleted the Job and took the event with it.
  #
  # WHY IT IS NARROW. `list` on `""/events` in the RUNNER namespace only, no `watch` and no `create`.
  # Events are metadata about objects this ServiceAccount already reads (its own Jobs and pods); they
  # carry no credential, unlike the `list` on secrets this Role deliberately refuses. The adapter
  # issues ONE such GET per poll and only while NO pod exists — the pathological case this exists for.
  #
  # A DEPLOYMENT THAT DOES NOT UPGRADE THIS ROLE STILL WORKS. The adapter accepts a 403 on the event
  # read and degrades to a less specific reason rather than letting an authorisation error stand in
  # for the real cause. Pinned by `kubernetes-adapter.test.ts`'s "A 403 ON THE EVENT READ DEGRADES".
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  {{- if .Values.managedRunners.kubernetes.perRunSecrets }}
  # THE PER-RUN SECRET GRANT (M23.2 declared it and shipped it OFF; the owner granted it 2026-08-20,
  # "grant the secrets RBAC, keep going"). This block is the ONLY thing that renders it, and the same
  # value sets the server-side flag, so the RBAC and the code's belief about the RBAC cannot diverge.
  #
  # WHY IT IS NEEDED AT ALL. `RunnerSpec.secretEnv` exists because credentials had to leave the
  # `docker create` argv (M23.1a, ADR-0035). On Kubernetes the only delivery that is not strictly
  # worse is a per-run Secret + `envFrom.secretRef`: `env[].value` puts the credential in etcd AND in
  # every etcd backup, in plaintext, with no lifetime at all. Without this rule managed-iac cannot
  # run on Kubernetes — it refuses at its first step — which is the state the grant exists to end.
  #
  # TWO VERBS, AND THE OMISSIONS ARE MEASUREMENTS.
  #   `get`    — NOT granted. A filterless read of every `SECRETS_PATH` use in
  #              `kubernetes-adapter.ts` finds one POST and two DELETEs and no GET. M23.2's own
  #              comment said "create,get,delete"; the code never needed the middle one.
  #   `list`   — NOT granted, and this one is a refusal rather than an omission. `list` on secrets
  #              returns every Secret BODY in the namespace, this release's own database password
  #              included. The reap sweep is built to work without it: it lists JOBS (not secret) and
  #              derives the Secret name from the Job's.
  #   `update`/`patch` on `jobs/finalizers` — NOT granted, which is why the per-run Secret's
  #              ownerReference sets `blockOwnerDeletion: false`.
  #
  # `delete` IS GRANTED, AND ITS BLAST RADIUS IS THE SAME SHAPE AS `list`'S — SAID HERE NOW RATHER
  # THAN LEFT UNSTATED (M23.5 MEDIUM-7). `list` was refused because it can READ every Secret's body
  # in this namespace; `delete` can DESTROY every Secret in this namespace, this release's own
  # database credential included. Proved with the worker's own token against a live cluster:
  #   DELETE …/secrets/scp-commanderscp-db -> {"status":"Success"} ; then GET -> NotFound
  # `resourceNames` cannot narrow it (see below), so the fix is the render-time guard in
  # `commanderscp.assertRunnerPrerequisites`: `perRunSecrets: true` with an empty
  # `managedRunners.kubernetes.namespace` refuses to render at all, unless the operator states
  # `acceptSharedNamespaceSecretDelete: true` and accepts this exact blast radius by name.
  #
  # WHAT COULD NOT BE NARROWED, SAID PLAINLY RATHER THAN LEFT AS A SILENCE: `resourceNames`. Per-run
  # Secret names derive from `runId`, so the set is unbounded — and Kubernetes RBAC cannot restrict a
  # `create` by `resourceNames` under ANY circumstances, because the object's name is not known to
  # the authorizer at admission time. So this is namespace-wide on `secrets`, deliberately and with
  # the reason stated. The narrowing that IS available is deployment-shaped:
  # `managedRunners.kubernetes.namespace` moves the Jobs, the Secrets, this Role and its binding into
  # a namespace of the runners' own, away from this release's Secrets. Recommended for anything
  # holding real cloud credentials, and as of M23.5 it is enforced by default rather than merely
  # recommended — see the render-time guard above.
  #
  # WHAT THE OWNER ACCEPTED BY GRANTING, recorded as a named combination in ADR-0035 rather than
  # implied here: a runner pod keeps a routable interface under owner decision 1's accepted
  # `--network none` -> fail-open NetworkPolicy degradation AND now holds a mounted credential.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "commanderscp.fullname" . }}-runner-iac
  namespace: {{ include "commanderscp.runnerNamespace" . }}
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
subjects:
  # THE SUBJECT STAYS WHERE THE WORKLOAD IS. A RoleBinding in namespace A may name a ServiceAccount
  # from namespace B; that is exactly what makes a separate runner namespace expressible at all.
  - kind: ServiceAccount
    name: {{ include "commanderscp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "commanderscp.fullname" . }}-runner-iac
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.managedIac.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "commanderscp.fullname" . }}-runner-iac-job-template
  labels:
    {{- include "commanderscp.labels" . | nindent 4 }}
data:
  # SUPERSEDED AS A SPECIFICATION, KEPT AS DOCUMENTATION (M23.4). When this was written nothing
  # launched a Kubernetes Job and this was the only statement of the intended shape. Since M23.2
  # `jobManifest()` in `packages/runner-launcher` builds the real thing and
  # `kubernetes-launch.golden.test.ts` pins it whole, so THIS is no longer what runs and differs from
  # it in at least three visible ways: `runAsNonRoot` is false by default (none of the three runner
  # images declares a USER, so true fails every run with CreateContainerConfigError), the volume is
  # the operator's RWX claim rather than an emptyDir (an emptyDir is not reachable from the worker,
  # so nothing could be copied in), and a credential arrives via `envFrom.secretRef` rather than as
  # env set "by the orchestrator at launch time". Read the golden for what a run actually creates.
  #
  # Reference shape ONLY (not applied as a live resource by this chart — see module doc above for
  # why a Job can't usefully be "installed once"). `__RUN_ID__`/`__ACTION__`/`__WORKSPACE_PVC__`
  # are placeholders a Kubernetes-native launcher substitutes per run.
  job-template.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: scp-runner-iac-__RUN_ID__
      labels:
        app.kubernetes.io/name: scp-runner-iac
        app.kubernetes.io/managed-by: scp-managed-iac
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: runner
              image: {{ .Values.managedIac.runnerImage | quote }}
              args: ["__ACTION__"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false # /workspace is written to (plan/apply/state files)
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
              # Vaulted, scoped infra credentials are injected here as env, per run — never a
              # tenant- or server-wide secret; resolved and set by the orchestrator at launch time
              # (mirrors the existing docker-create path's credential confinement contract).
          volumes:
            - name: workspace
              emptyDir: {}
{{- end }}
{{- end }}
