{{- include "commanderscp.assertRunnerPrerequisites" . }}
{{/*
worker — SCP_ROLE=worker: outbox relay, coordination reconcile loop, watchdog, subprocess plugin
host. Multiple replicas (M8 hardening — BUILD_AND_TEST.md §8 M8 item 6): the coordination
engine's wave-target trigger claim is a provable Postgres advisory-lock single-flight boundary
(coordination/trigger-claim-lock.ts) specifically so this is safe to scale past 1 — see that
module's doc comment and coordination.integration.test.ts's "multi-replica trigger claim is
single-flight" suite.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commanderscp.fullname" . }}-worker
  labels:
    {{- include "commanderscp.workerSelectorLabels" . | nindent 4 }}
    {{- include "commanderscp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "commanderscp.workerSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "commanderscp.workerSelectorLabels" . | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "commanderscp.serviceAccountName" . }}
      {{- /* M23.2 (owner decision 6): was `{{ .Values.managedIac.enabled }}`, which gave the worker a
             token for managed-IaC and NONE for managed-scan or managed-dep — and gave it one even
             on a docker-launcher deployment, where it is surface for nothing. Now it is exactly
             "can a managed runner launch through the API server from this pod". */}}
      automountServiceAccountToken: {{ eq (include "commanderscp.needsRunnerApiAccess" .) "true" }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "commanderscp.topologySpreadConstraints" (dict "constraints" .Values.worker.topologySpreadConstraints "selectorLabels" (include "commanderscp.workerSelectorLabels" .)) | nindent 6 }}
      initContainers:
        {{- include "commanderscp.waitForPostgresInitContainer" (dict "root" . "dbEnvVar" "SCP_RUNTIME_DATABASE_URL") | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "commanderscp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: SCP_ROLE
              value: "worker"
            {{- include "commanderscp.commonEnv" . | nindent 12 }}
            {{- include "commanderscp.runtimeDbEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          # worker's /healthz still answers (role=worker still boots the Fastify app — DESIGN
          # §16's "role flag" split is per-process work scheduling, not a separate binary/API
          # surface) — same liveness signal as api, cheap and accurate.
          # M9.3 (ADR-0001): the probes must speak HTTPS too when in-app federation mTLS is
          # enabled — see deployment-api.yaml's identical comment (there is only one listener,
          # per process, and it's HTTPS-or-not for ALL traffic, not just federation routes).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.federation.serverMtls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.federation.serverMtls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /var/lib/scp/storage
            {{- if .Values.federation.mtls.enabled }}
            - name: federation-mtls
              mountPath: /etc/scp/federation-mtls
              readOnly: true
            {{- end }}
            {{- if .Values.federation.serverMtls.enabled }}
            - name: federation-server-mtls
              mountPath: /etc/scp/federation-server-mtls
              readOnly: true
            {{- if .Values.federation.serverMtls.crl.enabled }}
            - name: federation-server-mtls-crl
              mountPath: /etc/scp/federation-server-mtls-crl
              readOnly: true
            {{- end }}
            {{- end }}
            {{- /* M23.5 — EVERY WORKER-ROLE WRITE PATH, from the one helper `deployment-api.yaml`
                   also includes. Keyed on the ROLE, never on which Deployment this is: the same
                   three mounts are needed by an `api.role=all` pod, and two of the three were
                   missing there. See `commanderscp.podRunsWorkerRole`. */}}
            {{- include "commanderscp.workerRoleVolumeMounts" (dict "root" . "role" "worker") | nindent 12 }}
            {{- if .Values.scanDbCache.enabled }}
            - name: scan-db
              mountPath: {{ .Values.scanDbCache.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: storage
          {{- if eq .Values.objectStorage.provider "filesystem" }}
          persistentVolumeClaim:
            claimName: {{ .Values.objectStorage.filesystem.existingClaim | default (printf "%s-storage" (include "commanderscp.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.scanDbCache.enabled }}
        - name: scan-db
          persistentVolumeClaim:
            claimName: {{ .Values.scanDbCache.existingClaim | default (printf "%s-scan-db" (include "commanderscp.fullname" .)) }}
        {{- end }}
        {{- if .Values.federation.mtls.enabled }}
        - name: federation-mtls
          secret:
            secretName: {{ .Values.federation.mtls.existingSecret }}
        {{- end }}
        {{- if .Values.federation.serverMtls.enabled }}
        - name: federation-server-mtls
          secret:
            secretName: {{ .Values.federation.serverMtls.existingSecret }}
        {{- if .Values.federation.serverMtls.crl.enabled }}
        - name: federation-server-mtls-crl
          secret:
            secretName: {{ .Values.federation.serverMtls.crl.existingSecret }}
        {{- end }}
        {{- end }}
        {{- include "commanderscp.workerRoleVolumes" (dict "root" . "role" "worker") | nindent 8 }}
