{{- include "commanderscp.assertRunnerPrerequisites" . }}
{{- include "commanderscp.assertMultiClusterPrerequisites" . }}
{{- include "commanderscp.assertRetransVolumePrerequisites" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commanderscp.fullname" . }}-api
  labels:
    {{- include "commanderscp.apiSelectorLabels" . | nindent 4 }}
    {{- include "commanderscp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "commanderscp.apiSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "commanderscp.apiSelectorLabels" . | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "commanderscp.serviceAccountName" . }}
      {{- /* CONDITIONAL SINCE M23.2 (owner decision 6). It was a hard `false`, which is right for
             every deployment that launches no managed runner — and fatal for the one topology
             `values.yaml` itself documents as supported: `api.role=all` with `worker.replicaCount: 0`
             puts the managed executors in THIS pod, and a Kubernetes launcher with no token cannot
             authenticate to the API server at all. True only when the Kubernetes launcher is
             selected, a managed class is enabled, AND this pod actually runs the worker role. */}}
      automountServiceAccountToken: {{ and (eq (include "commanderscp.needsRunnerApiAccess" .) "true") (eq .Values.api.role "all") }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "commanderscp.topologySpreadConstraints" (dict "constraints" .Values.api.topologySpreadConstraints "selectorLabels" (include "commanderscp.apiSelectorLabels" .)) | nindent 6 }}
      initContainers:
        {{- include "commanderscp.waitForPostgresInitContainer" (dict "root" . "dbEnvVar" "SCP_RUNTIME_DATABASE_URL") | nindent 8 }}
      # Pod-level (see the api container's preStop note): must outlast preStop + the SIGTERM drain.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: api
          image: {{ include "commanderscp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: SCP_ROLE
              value: {{ include "commanderscp.apiRole" . | quote }}
            {{- include "commanderscp.commonEnv" . | nindent 12 }}
            {{- include "commanderscp.runtimeDbEnv" . | nindent 12 }}
          # PRE-STOP DELAY — the difference between "graceful shutdown" and "zero downtime".
          #
          # main.ts already handles SIGTERM with `app.close()`, which drains in-flight requests. That
          # is NOT sufficient on its own, because on pod deletion Kubernetes does two things
          # CONCURRENTLY and in no guaranteed order: it sends SIGTERM, and it removes the pod from
          # the Service's endpoints. If the listener closes before every kube-proxy has caught up, a
          # NEW connection is still routed to this pod and is refused — the client sees a
          # connection-level error, not a graceful 503.
          #
          # Sleeping here keeps the listener up while that propagation finishes; SIGTERM is delivered
          # only AFTER preStop returns, so the drain still happens, just late enough to be safe. This
          # is the standard remedy and it costs nothing on a healthy rollout.
          #
          # MEASURED 2026-08-29: without it the kind drill's in-cluster zero-downtime witness saw a
          # single `000` connection failure during `helm upgrade` (runs went 0, 0, 1 non-200 — the
          # intermittency is the tell for an endpoint-propagation race rather than a broken deploy).
          # The witness only became able to observe this at all once it stopped measuring its own
          # port-forward; the property was never verified before.
          #
          # The pod-level `terminationGracePeriodSeconds` (set on the pod spec below, NOT here —
          # it is a POD field and Kubernetes rejects it on a container) must exceed this delay plus
          # the drain, or the kubelet SIGKILLs mid-drain and reintroduces the very failure this
          # prevents.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.api.preStopSleepSeconds | default 5 }}"]
          ports:
            - name: http
              containerPort: 8080
          # M9.3 (ADR-0001): when in-app federation mTLS is enabled, apps/server's ONE Fastify
          # listener speaks HTTPS for ALL traffic (there is no per-route TLS) — the probes must
          # follow, or they fail their own TLS handshake against a plain-HTTP-expecting client.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.federation.serverMtls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if .Values.federation.serverMtls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /var/lib/scp/storage
            {{- if .Values.scanDbCache.enabled }}
            - name: scan-db
              mountPath: {{ .Values.scanDbCache.mountPath }}
            {{- end }}
            {{- if .Values.federation.mtls.enabled }}
            - name: federation-mtls
              mountPath: /etc/scp/federation-mtls
              readOnly: true
            {{- end }}
            {{- if .Values.executorTls.enabled }}
            - name: executor-tls-ca
              mountPath: /etc/scp/executor-tls
              readOnly: true
            {{- end }}
            {{- if .Values.federation.serverMtls.enabled }}
            - name: federation-server-mtls
              mountPath: /etc/scp/federation-server-mtls
              readOnly: true
            {{- if .Values.federation.serverMtls.crl.enabled }}
            - name: federation-server-mtls-crl
              mountPath: /etc/scp/federation-server-mtls-crl
              readOnly: true
            {{- end }}
            {{- end }}
            {{- /* M23.5 — THE WORKER-ROLE WRITE PATHS, WHICH THIS POD ALSO NEEDS AT `api.role=all`.
                   Renders NOTHING at the default `api.role=api`. M23.2 already made this pod's
                   service-account token conditional on running the worker role; its volumes stayed
                   keyed on the Deployment's name, so on the single-pod topology `values.yaml` itself
                   documents, the pod that runs the managed executors mounted neither the shared
                   runner workspace nor the managed-IaC scratch dir. See
                   `commanderscp.podRunsWorkerRole`. */}}
            {{- include "commanderscp.workerRoleVolumeMounts" (dict "root" . "role" "api") | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: storage
          {{- if eq .Values.objectStorage.provider "filesystem" }}
          persistentVolumeClaim:
            claimName: {{ .Values.objectStorage.filesystem.existingClaim | default (printf "%s-storage" (include "commanderscp.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.scanDbCache.enabled }}
        - name: scan-db
          persistentVolumeClaim:
            claimName: {{ .Values.scanDbCache.existingClaim | default (printf "%s-scan-db" (include "commanderscp.fullname" .)) }}
        {{- end }}
        {{- if .Values.federation.mtls.enabled }}
        - name: federation-mtls
          secret:
            secretName: {{ .Values.federation.mtls.existingSecret }}
        {{- end }}
        {{- if .Values.executorTls.enabled }}
        - name: executor-tls-ca
          secret:
            secretName: {{ required "executorTls.enabled=true requires executorTls.existingSecret — the Secret holding the CA bundle under key `ca.crt`. Fail-closed: an unset path would boot with system roots only and every private-CA executor would fail verification at request time instead of at install." .Values.executorTls.existingSecret }}
        {{- end }}
        {{- if .Values.federation.serverMtls.enabled }}
        - name: federation-server-mtls
          secret:
            secretName: {{ .Values.federation.serverMtls.existingSecret }}
        {{- if .Values.federation.serverMtls.crl.enabled }}
        - name: federation-server-mtls-crl
          secret:
            # A SEPARATE Secret from federation-server-mtls above (ADR-0001 §8) — refreshing the
            # CRL (which rotates far more often than CA/server-cert material) only ever touches
            # THIS Secret, never re-rolling the CA/cert/key one.
            secretName: {{ .Values.federation.serverMtls.crl.existingSecret }}
        {{- end }}
        {{- end }}
        {{- include "commanderscp.workerRoleVolumes" (dict "root" . "role" "api") | nindent 8 }}
