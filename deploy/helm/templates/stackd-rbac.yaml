{{- if .Values.stackd.enabled }}
{{- $name := printf "%s-stackd" (include "commanderscp.fullname" .) }}
{{- $sns := include "commanderscp.stackdNamespace" . }}
{{/*
THE STACK CONTROLLER'S IDENTITY AND ITS RIGHTS (M29.4, ADR-0058 E1). Stated plainly, because it is
the point of this file: installing upstream Argo means creating CustomResourceDefinitions,
ClusterRoles and ClusterRoleBindings, and creating a role that grants what you do not already
hold requires `escalate`, binding one requires `bind`. That is near cluster-admin, and no scoping
makes it less so — so the mitigation is SEPARATION:

  - it lives in ITS OWN NAMESPACE (`stackd.namespace`, created here), with its pod, its
    credential and its state — review B1: in the release namespace, any identity that can create a
    pod there (the runner Role's `jobs create`) could run a pod AS this ServiceAccount and hold its
    rights. Nothing else this chart renders has any right in that namespace, and the render FAILS
    if something would (`commanderscp.assertStackdNamespaceIsolated`); tools/helm-verify proves it
    across a value matrix, and the kind suite proves a runner-SA takeover Job is refused;
  - this ServiceAccount is bound by exactly the bindings below and used by exactly one pod, the
    stackd Deployment; no scpd workload runs as it or mounts its token or credential
    (tools/helm-verify asserts all three);
  - its NAMESPACED rights (Secrets, workloads, Roles) exist only inside the five backend
    namespaces this file creates, each through its own RoleBinding to a ClusterRole that is bound
    nowhere cluster-wide — so it can read no Secret in SCP's namespace, where scpd's database
    credentials live;
  - its CLUSTER rights are the kinds the vendored manifests are made of, verb by verb, with
    Namespaces limited by name to those five; CRDs can be created and patched and never deleted.

The rule set is DERIVED from what the chart renders: tools/helm-verify renders every backend and
fails if any rendered kind is not granted here (sufficiency), and the kind harness runs the
controller with exactly this ServiceAccount (the grants are not trusted, they are exercised).
*/}}
{{- /*
#422 re-verify, item 5 — the SAME hazard postgres-eval.yaml's header comment documents in full:
Helm's hook execution raw-Create()s on every firing of a hook it never deletes first
(hook-delete-policy: hook-failed), so a SECOND `helm upgrade` 409s on "already exists" (measured
live, the same census that found this in secrets-generated.yaml and stackd.yaml too). A Namespace
has no value to preserve or drift, so skip rendering entirely once it already exists.
*/}}
{{- if not (lookup "v1" "Namespace" "" $sns) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $sns }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
  annotations:
    # A hook, so it exists before the credential Secret (weight -10) that lives in it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": hook-failed
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  # Explicit, because the bindings below name it by namespace and a `helm template | kubectl apply`
  # (the kind harness) would otherwise create it wherever kubectl points.
  namespace: {{ $sns }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-cluster
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "create", "patch", "delete", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames:
      {{- range .Values.stackd.backendNamespaces }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-cluster
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $sns }}
---
{{/* ITS OWN STATE (apps/stackd/src/state.ts): the inventory and the last good set, as Secrets in
its own namespace — the one place no backend and no scpd identity can write. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-state
  namespace: {{ $sns }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-state
  namespace: {{ $sns }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-state
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $sns }}
---
{{/*
M29.2 (ADR-0061) — THE NETWORK HALF OF A WIRED BACKEND'S EGRESS. When the controller wires a
backend into SCP it writes ONE NetworkPolicy into SCP's own namespace, `scp-stack-egress-<backend>`,
letting scpd's pods reach exactly that backend's pods on its container port — derived from the
backend's rendered Service, so the endpoint the app-layer egress opens and the one the network opens
are the same object (no value to set in two places). NetworkPolicies ONLY: no Secret, no workload,
nothing that reads scpd's credentials. get/patch/delete are held to the three policy names;
`create` cannot be limited by name in RBAC, so what the controller could add is further allow-only
policies here — stated in ADR-0061, and bounded by what this controller already holds cluster-wide.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["scp-stack-egress-argocd", "scp-stack-egress-argo-workflows", "scp-stack-egress-gitea"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-egress
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $sns }}
---
{{/* Bound ONLY by the per-namespace RoleBindings below — never cluster-wide. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-namespaced
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["get", "create", "patch", "delete", "escalate", "bind"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get", "create", "patch", "delete"]
---
{{/*
M29.3 (ADR-0062) — CANARY OUT OF THE BOX. The controller applies three kinds of Argo CD object in
Argo CD's namespace: the authoring AppProject (ADR-0055 D10's shape), its own project for the
Rollouts installs, and one Rollouts-to-target Application per cluster registered with Argo CD. A
Role there, argoproj.io applications and appprojects only — no Secret, no workload beyond what the
backends' own binding already allows. And the ONE namespace authored deployments land in on this
cluster is created here, kept on uninstall (it holds the workloads SCP deployed).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-authoring
  namespace: {{ .Values.stackd.authoring.argocdNamespace }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "appprojects"]
    verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-authoring
  namespace: {{ .Values.stackd.authoring.argocdNamespace }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-authoring
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $sns }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.stackd.authoring.namespace }}
  labels:
    {{- include "commanderscp.stackdLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- range .Values.stackd.backendNamespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    {{- include "commanderscp.stackdLabels" $ | nindent 4 }}
  annotations:
    # The backends' data (Gitea's repositories, Argo CD's state) lives here. Uninstalling SCP
    # removes SCP; deleting a backend's data is a separate, deliberate act.
    helm.sh/resource-policy: keep
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "commanderscp.stackdLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-namespaced
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $sns }}
{{- end }}
{{- end }}
