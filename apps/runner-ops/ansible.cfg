# Defence in depth ONLY. The control is deletion (prune.py, ADR-0050) — this file cannot be the
# control, because `ANSIBLE_CONFIG` and a cwd `ansible.cfg` both override it and a run's working
# directory is not something this image can guarantee. Everything set here is already true by
# construction in a pruned image; it is kept so that a misconfigured or partially-pruned image
# still fails closed rather than quietly widening.
[defaults]
# Tenant parameters are data, never Jinja2 (M27.2). This is the config-layer half of that.
allow_unsafe_lookups = False
# No implicit fact gathering: a role that wants facts asks for them, so the default play does not
# silently run `setup` against every host in the compiled inventory.
gathering = explicit
# Host key checking stays ON. The runner reaches hosts over a per-run network allowlist (M27.6);
# disabling this would turn a narrow path into a MITM opportunity.
host_key_checking = True
retry_files_enabled = False
# Never write world-readable temporary files on the target: the runner may push config containing
# material the tenant would not publish.
allow_world_readable_tmpfiles = False

[ssh_connection]
# No ControlMaster socket: runs are single-shot and ephemeral, and a persisted multiplex socket
# would outlive the run whose credential authorized it.
ssh_args = -o ControlMaster=no -o ControlPersist=no
pipelining = False
