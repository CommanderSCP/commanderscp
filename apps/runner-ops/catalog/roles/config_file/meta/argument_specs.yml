argument_specs:
  main:
    short_description: Render a template or push a configuration file.
    options:
      dest_path:
        type: str
        required: true
      content:
        type: str
        required: true
      owner:
        type: str
        required: false
      group:
        type: str
        required: false
      mode:
        type: str
        required: false
        default: "0644"
