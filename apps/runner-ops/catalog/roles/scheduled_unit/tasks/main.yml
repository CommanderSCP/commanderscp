# CLASS 3: cron entries and systemd unit changes.
#
# THE CONNECTION IS ALREADY ROOT, so there is no `become:` here (owner decision 2026-09-23,
# amending ADR-0051 D4). It used to say `become: true`, which was never reachable: Ansible's become
# runs `sudo ... /bin/sh -c '... python3 .../AnsiballZ_*.py'`, so the restricted sudoers fragment
# M27.8 generated — naming apt-get/dnf/systemctl — granted nothing this role invokes, and the rule
# that would have worked is a root shell. The certificate's principal is `root` and says so.
- name: manage the systemd unit
  ansible.builtin.systemd_service:
    name: "{{ unit_name }}"
    state: "{{ unit_state | default(omit) }}"
    enabled: "{{ enabled | default(omit) }}"
  when: kind == 'systemd'

- name: manage the cron entry
  ansible.builtin.cron:
    name: "{{ unit_name }}"
    job: "{{ cron_command }}"
    # Five fields, split positionally. `cron_schedule` is tenant data and arrives !unsafe, so the
    # split operates on a literal string and each field is written verbatim into the crontab.
    minute: "{{ cron_schedule.split(' ')[0] }}"
    hour: "{{ cron_schedule.split(' ')[1] }}"
    day: "{{ cron_schedule.split(' ')[2] }}"
    month: "{{ cron_schedule.split(' ')[3] }}"
    weekday: "{{ cron_schedule.split(' ')[4] }}"
  when: kind == 'cron'
